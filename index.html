<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#16241C">
<meta name="format-detection" content="telephone=no, date=no">
<title>Tournament Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --board:#16241C;
    --board-alt:#1E3226;
    --board-line: rgba(241,234,218,0.12);
    --amber:#E8B94A;
    --amber-dim: rgba(232,185,74,0.55);
    --cream:#F1EADA;
    --ink:#20261D;
    --red-over:#C1543A;
    --green-under:#6FA05A;
    --radius: 4px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html{ overscroll-behavior-y: contain; }
  button, .clear-x, nav.tabs button, .toplevel-tabs button, summary, .hole-grid button, label{
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
  }
  button:active, .btn:active, .clear-x:active, .toplevel-tabs button:active{
    opacity: 0.7;
  }
  input, select, textarea{
    touch-action: manipulation;
  }
  html,body{margin:0;padding:0;}
  body{
    background: var(--board);
    color: var(--cream);
    font-family:'IBM Plex Sans', sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
  }
  #app{
    width:100%;
    max-width:560px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    background: var(--board);
  }
  header{
    padding: max(22px, env(safe-area-inset-top, 0px)) 20px 16px;
    border-bottom: 1px solid var(--board-line);
    background: linear-gradient(180deg, var(--board-alt), var(--board));
  }
  #tournamentImage{
    width: 100%;
    max-height: 140px;
    object-fit: cover;
    border-radius: 6px;
    margin-bottom: 14px;
  }
  header .eyebrow{
    font-family:'Oswald',sans-serif;
    letter-spacing: 0.04em;
    font-size: 12px;
    color: var(--amber-dim);
    margin: 0 0 4px;
  }
  header h1{
    font-family:'Oswald',sans-serif;
    font-weight:600;
    font-size: 26px;
    margin:0;
    color: var(--amber);
    letter-spacing: 0.01em;
  }
  header .sub{
    font-size: 13px;
    color: var(--cream);
    opacity:0.65;
    margin-top: 4px;
  }
  main{
    flex:1;
    padding: 18px 16px 90px;
    overflow-y:auto;
  }
  nav.tabs{
    position: sticky;
    bottom:0;
    display:flex;
    border-top: 1px solid var(--board-line);
    background: var(--board-alt);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  nav.tabs button{
    flex:1;
    background:none;
    border:none;
    color: var(--cream);
    opacity:0.55;
    font-family:'Oswald',sans-serif;
    font-size: 12px;
    letter-spacing:0.02em;
    padding: 14px 2px 12px;
    cursor:pointer;
    border-top: 2px solid transparent;
  }
  nav.tabs button.active{
    opacity:1;
    color: var(--amber);
    border-top: 2px solid var(--amber);
  }
  h2.section-title{
    font-family:'Oswald',sans-serif;
    font-weight:500;
    font-size: 15px;
    letter-spacing:0.02em;
    color: var(--amber);
    margin: 22px 0 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--board-line);
  }
  h2.section-title:first-child{ margin-top:0; }
  h3.sub-title{
    font-family:'Oswald',sans-serif;
    font-weight:500;
    font-size: 13px;
    color: var(--cream);
    opacity: 0.75;
    margin: 14px 0 8px;
  }
  .card{
    background: var(--board-alt);
    border: 1px solid var(--board-line);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 12px;
  }
  .lb-row{
    display:flex;
    align-items:center;
    padding: 10px 2px;
    border-bottom: 1px solid var(--board-line);
  }
  .lb-row:last-child{border-bottom:none;}
  .lb-rank{
    width: 26px;
    font-family:'Oswald',sans-serif;
    color: var(--amber-dim);
    font-size: 14px;
  }
  .lb-name{
    flex:1;
    font-size: 15px;
    font-weight:500;
  }
  .lb-name .hcp{
    font-size:11px;
    opacity:0.5;
    font-weight:400;
    margin-left:6px;
  }
  .lb-score{
    font-family:'Oswald',sans-serif;
    font-size: 20px;
    font-variant-numeric: tabular-nums;
    min-width: 46px;
    text-align:right;
  }
  .lb-score.dim{ opacity:0.35; }
  select, input[type=text], input[type=number], input[type=date]{
    width:100%;
    background: var(--cream);
    color: var(--ink);
    border: none;
    border-radius: var(--radius);
    padding: 12px 12px;
    font-size: 16px;
    font-family:'IBM Plex Sans', sans-serif;
    margin-bottom: 12px;
  }
  input[type=number].hole-input{
    padding: 8px 4px;
    text-align:center;
    font-family:'Oswald',sans-serif;
    margin-bottom:0;
  }
  label{
    display:block;
    font-size: 12px;
    color: var(--amber-dim);
    margin-bottom: 6px;
    font-family:'Oswald',sans-serif;
    letter-spacing:0.02em;
  }
  .btn{
    width:100%;
    background: var(--amber);
    color: var(--ink);
    border:none;
    border-radius: var(--radius);
    padding: 13px;
    font-family:'Oswald',sans-serif;
    font-size: 15px;
    letter-spacing:0.02em;
    font-weight:600;
    cursor:pointer;
  }
  .btn.secondary{
    background: transparent;
    border: 1px solid var(--amber-dim);
    color: var(--amber);
  }
  .btn.tiny{
    width:auto;
    padding: 6px 12px;
    font-size: 12px;
  }
  .hole-grid{
    display:grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 6px;
    margin-bottom: 14px;
  }
  .hole-grid button{
    aspect-ratio: 1;
    background: var(--board);
    border: 1px solid var(--board-line);
    color: var(--cream);
    border-radius: var(--radius);
    font-family:'Oswald',sans-serif;
    font-size:14px;
    cursor:pointer;
    position:relative;
  }
  .hole-grid button.active{
    background: var(--amber);
    color: var(--ink);
    border-color: var(--amber);
  }
  .hole-grid button .dot{
    position:absolute;
    top:3px; right:4px;
    width:5px; height:5px;
    border-radius:50%;
    background: var(--green-under);
  }
  .row-flex{ display:flex; gap:8px; align-items:center; }
  .row-flex > *{flex:1;}
  .list-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 8px 0;
    border-bottom: 1px solid var(--board-line);
    font-size: 14px;
    gap:8px;
  }
  .list-item:last-child{border-bottom:none;}
  .list-item input[type=number]{ width: 70px; margin:0; padding:8px; }
  .remove-x{
    color: var(--red-over);
    background:none;
    border:none;
    font-size: 18px;
    cursor:pointer;
    padding: 0 6px;
  }
  .muted{ color: var(--cream); opacity:0.55; font-size:13px; }
  .status-msg{ text-align:center; font-size: 13px; color: var(--amber); margin-top: 10px; min-height: 18px; }
  .empty-state{ text-align:center; padding: 40px 20px; color: var(--cream); opacity:0.5; font-size: 14px; }
  .tag{
    display:inline-block;
    font-family:'Oswald',sans-serif;
    font-size: 11px;
    color: var(--amber-dim);
    border: 1px solid var(--amber-dim);
    border-radius: 3px;
    padding: 2px 6px;
    margin-left: 6px;
  }
  .scorecard-grid{
    display:grid;
    grid-template-columns: 34px 1fr 1fr;
    gap:4px 8px;
    align-items:center;
    font-size:13px;
  }
  .scorecard-grid .hdr{
    font-family:'Oswald',sans-serif;
    color: var(--amber-dim);
    font-size:11px;
    padding-bottom:4px;
    border-bottom: 1px solid var(--board-line);
    margin-bottom:4px;
  }
  .scorecard-grid .hole-num{
    font-family:'Oswald',sans-serif;
    color: var(--cream);
    opacity:0.6;
  }
  .toplevel-tabs{
    display:flex;
    gap:6px;
    margin-bottom:16px;
    flex-wrap:wrap;
  }
  .toplevel-tabs button{
    background: var(--board-alt);
    border:1px solid var(--board-line);
    color: var(--cream);
    opacity:0.6;
    font-family:'Oswald',sans-serif;
    font-size:12px;
    padding: 8px 12px;
    border-radius: 3px;
    cursor:pointer;
  }
  .toplevel-tabs button.active{
    opacity:1;
    color: var(--ink);
    background: var(--amber);
    border-color: var(--amber);
  }
  .group-box{
    border: 1px solid var(--board-line);
    border-radius: var(--radius);
    padding: 10px 12px;
    margin-bottom: 10px;
  }
  .group-box .group-label{
    font-family:'Oswald',sans-serif;
    font-size: 12px;
    color: var(--amber-dim);
    margin-bottom:8px;
  }
  .group-box select{ margin-bottom: 8px; }
  .group-box select:last-of-type{ margin-bottom:0; }
  details{ margin-bottom: 12px; }
  summary{
    cursor:pointer;
    font-family:'Oswald',sans-serif;
    font-size:13px;
    color: var(--amber);
    padding: 6px 0;
  }
  .hole-list{
    padding: 6px 12px;
  }
  .hole-row{
    display:flex;
    align-items:center;
    gap: 10px;
    padding: 9px 0;
    border-bottom: 1px solid var(--board-line);
  }
  .hole-row:last-child{ border-bottom:none; }
  .hole-row-num{
    font-family:'Oswald',sans-serif;
    font-size: 16px;
    color: var(--amber);
    width: 22px;
    text-align:center;
    flex-shrink:0;
  }
  .hole-row-par{
    font-size: 12px;
    color: var(--cream);
    opacity: 0.5;
    width: 46px;
    flex-shrink:0;
  }
  .hole-row-input{
    flex:1;
    text-align:center;
    font-family:'Oswald',sans-serif;
    font-size: 17px;
    margin-bottom:0;
    padding: 9px 6px;
  }
  .clear-x{
    background:none;
    border:none;
    color: var(--red-over);
    font-size: 20px;
    line-height:1;
    width: 22px;
    flex-shrink:0;
    cursor:pointer;
  }
  .hole-row-status{
    font-size: 11px;
    color: var(--green-under);
    width: 44px;
    flex-shrink:0;
    text-align:right;
    opacity:0;
    transition: opacity 0.2s;
  }
  .hole-row-status.show{ opacity:1; }
  .hole-row-status.error{ color: var(--red-over); }
  .hole-row{ flex-wrap: wrap; }
  .hole-extra{
    flex-basis: 100%;
    display:flex;
    align-items:center;
    gap: 8px;
    margin-top: 6px;
    padding-left: 32px;
    font-size: 12px;
    color: var(--amber-dim);
    font-family:'Oswald',sans-serif;
  }
  .hole-extra input[type=number]{
    width: 58px;
    padding: 6px 4px;
    margin: 0;
    text-align:center;
    font-family:'IBM Plex Sans', sans-serif;
    font-size: 16px;
  }
  .hole-extra label{
    display:flex;
    align-items:center;
    gap: 5px;
    margin:0;
    font-size: 13px;
    color: var(--cream);
    opacity:0.85;
    cursor:pointer;
  }
  .hole-extra input[type=checkbox]{
    width:16px; height:16px; margin:0;
  }
  .kp-ld-card{
    display:flex;
    flex-direction:column;
    gap: 10px;
  }
  .kp-ld-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding: 6px 2px;
  }
  .kp-ld-label{
    font-family:'Oswald',sans-serif;
    font-size: 12px;
    color: var(--amber-dim);
  }
  .kp-ld-value{
    font-size: 14px;
    text-align:right;
  }
  .lb-score-wrap{
    display:flex;
    flex-direction:row;
    align-items:baseline;
    justify-content:flex-end;
    gap: 8px;
    min-width: 46px;
  }
  .lb-topar{
    font-family:'Oswald',sans-serif;
    font-size: 20px;
    font-variant-numeric: tabular-nums;
    letter-spacing:0.02em;
  }
  .lb-topar.under{ color: var(--green-under); }
  .lb-topar.over{ color: var(--red-over); }
  .lb-topar.even{ color: var(--amber-dim); }
</style>
</head>
<body>
<div id="app">
  <header>
    <img id="tournamentImage" src="" alt="" style="display:none;">
    <p class="eyebrow">LIVE SCOREBOARD</p>
    <h1 id="tournamentName">Tournament</h1>
    <p class="sub" id="headerSub">loading...</p>
  </header>
  <main id="main"></main>
  <nav class="tabs">
    <button data-tab="leaderboard" class="active">BOARD</button>
    <button data-tab="enter">ENTER</button>
    <button data-tab="setup">SETUP</button>
  </nav>
</div>

<script>
const STORAGE_KEY = 'tournament-data-v2';

// Change this to whatever PIN you want organizers to use to access Setup.
const SETUP_PIN = '1234';

const ROSTER_R1 = ['Surag','Niki','Woody','Sanjay','Ketal','Vikas','Shiv','Shaan','Samir','James','Parag','Ian','Roshan','Cham','Rishee','Archish'];

// partnerOrder[i] = which slot (1,2,or3) pairs with slot 0 during segment i (holes 1-6, 7-12, 13-18).
// The other two slots automatically pair with each other.
const QUADS_R1 = [
  { players:['Surag','Niki','Woody','Sanjay'], partnerOrder:[2,3,1] },
  { players:['Ketal','Vikas','Shiv','Shaan'],   partnerOrder:[3,1,2] },
  { players:['Samir','James','Parag','Ian'],    partnerOrder:[2,3,1] },
  { players:['Roshan','Cham','Rishee','Archish'], partnerOrder:[2,3,1] }
];

// Pre-loaded scorecards, keyed by exact course name as entered in Setup.
const KNOWN_SCORECARDS = {
  'Twin Warriors': {
    par:      [5,4,4,3,4,4,4,5,3, 4,4,5,3,4,3,5,4,4],
    hcpIndex: [9,7,3,15,13,11,1,5,17, 2,16,4,14,18,12,8,10,6]
  },
  'Paako Ridge': {
    par:      [4,4,5,3,5,4,4,3,4, 4,4,5,4,3,5,3,4,4],
    hcpIndex: [13,11,5,17,7,15,1,9,3, 10,2,14,16,8,4,18,12,6]
  },
  'Sandia Resort': {
    par:      [4,4,3,4,5,4,5,3,4, 4,5,3,4,4,4,3,5,4],
    hcpIndex: [11,3,17,15,5,1,9,13,7, 12,2,18,16,4,8,10,14,6]
  }
};
let state = null;
let currentTab = 'leaderboard';
let lbView = 'overall'; // overall | r1 | r2 | r3
let entrySel = { round: 'r1', player: '', hole: 1 };
let entryMode = 'player'; // 'player' | 'hole'
let pollTimer = null;
// Tracks open/closed state of <details> sections across re-renders (not persisted to backend, per-browser only).
const uiDetailsState = {};

// Which holes are Closest-to-Pin / Longest-Drive contests, per round.
const ROUND_KP_LD_DEFAULTS = {
  r1: { kp:[4,13], ld:[8,16] },
  r2: { kp:[4,16], ld:[5,12] },
  r3: { kp:[8,12], ld:[7,17] }
};

function blankHoles(n){ return Array.from({length:n}, ()=>null); }

function defaultState(){
  return {
    name: 'Golf Tournament',
    tournamentImageUrl: '',
    useCourseHandicap: false, // global default: false = straight Handicap Index everywhere
    players: Array.from({length:16}, (_,i)=>({ name:`Player ${i+1}`, handicap: 0 })),
    rounds: [
      {
        id:'r1', label:'Round 1', course:'Twin Warriors', date:'',
        format:'sixes', visible: true,
        par: KNOWN_SCORECARDS['Twin Warriors'].par.slice(), hcpIndex: KNOWN_SCORECARDS['Twin Warriors'].hcpIndex.slice(),
        rating: 69.9, slope: 133, logoUrl: '',
        useCourseHandicap: null, // null = inherit tournament default; true/false = override for this round
        handicapOverrides: {}, // { playerName: number } — per-round handicap adjustment, defaults to player's base handicap if unset
        groups: [], quads: [], pairs: [], teeGroups: [],
        kpHoles: ROUND_KP_LD_DEFAULTS.r1.kp.slice(), ldHoles: ROUND_KP_LD_DEFAULTS.r1.ld.slice()
      },
      {
        id:'r2', label:'Round 2', course:'Paako Ridge', date:'',
        format:'pairs', visible: true,
        par: blankHoles(18), hcpIndex: blankHoles(18),
        rating: 69.7, slope: 132, logoUrl: '',
        useCourseHandicap: null,
        handicapOverrides: {},
        groups: [], quads: [], pairs: [], teeGroups: [],
        kpHoles: ROUND_KP_LD_DEFAULTS.r2.kp.slice(), ldHoles: ROUND_KP_LD_DEFAULTS.r2.ld.slice()
      },
      {
        id:'r3', label:'Round 3', course:'Sandia Resort', date:'',
        format:'stroke', visible: true,
        par: blankHoles(18), hcpIndex: blankHoles(18),
        rating: 69.8, slope: 129, logoUrl: '',
        useCourseHandicap: null,
        handicapOverrides: {},
        groups: [], quads: [], pairs: [], teeGroups: [],
        kpHoles: ROUND_KP_LD_DEFAULTS.r3.kp.slice(), ldHoles: ROUND_KP_LD_DEFAULTS.r3.ld.slice()
      }
    ],
    scores: {}, // key `${roundId}__${player}__${hole}` -> strokes (number)
    kp: {},     // key `${roundId}__${player}__${hole}` -> {feet, inches}
    ld: {}      // key `${roundId}__${player}__${hole}` -> {checked, ts}
  };
}

// ============================================================
// BACKEND CONFIG — edit this block to switch where data is stored.
// All three modes use the exact same app; only this config changes.
// ============================================================
const BACKEND = {
  // 'rest'     = your own self-hosted server (Docker on NAS/Mac)
  // 'firebase' = Firebase Realtime Database (no server needed)
  // 'sheets'   = Google Apps Script backed by a Google Sheet
  mode: 'firebase',

  // --- mode: 'rest' ---
  // URL of your self-hosted server's state endpoint, e.g. http://192.168.1.50:3000/api/state
  restUrl: 'http://localhost:3000/api/state',

  // --- mode: 'firebase' ---
  // Your Realtime Database URL + a path, with .json appended, e.g.:
  // https://your-project-default-rtdb.firebaseio.com/tournament.json
  firebaseUrl: 'https://el17-abq-default-rtdb.firebaseio.com/tournament.json',

  // --- mode: 'sheets' ---
  // Your deployed Apps Script Web App URL (ends in /exec)
  sheetsUrl: 'https://script.google.com/macros/s/YOUR_DEPLOYMENT_ID/exec'
};

async function backendGet(){
  if(BACKEND.mode === 'rest'){
    const res = await fetch(BACKEND.restUrl);
    if(!res.ok) throw new Error('rest get failed: ' + res.status);
    const data = await res.json();
    return (data && Object.keys(data).length) ? data : null;
  }
  if(BACKEND.mode === 'firebase'){
    const res = await fetch(BACKEND.firebaseUrl);
    if(!res.ok) throw new Error('firebase get failed: ' + res.status);
    const data = await res.json();
    return data || null;
  }
  if(BACKEND.mode === 'sheets'){
    const res = await fetch(BACKEND.sheetsUrl + '?action=get');
    if(!res.ok) throw new Error('sheets get failed: ' + res.status);
    const data = await res.json();
    return (data && Object.keys(data).length) ? data : null;
  }
  throw new Error('Unknown BACKEND.mode: ' + BACKEND.mode);
}

async function backendSet(stateObj){
  if(BACKEND.mode === 'rest'){
    const res = await fetch(BACKEND.restUrl, {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(stateObj)
    });
    if(!res.ok) throw new Error('rest set failed: ' + res.status);
    return;
  }
  if(BACKEND.mode === 'firebase'){
    const res = await fetch(BACKEND.firebaseUrl, {
      method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(stateObj)
    });
    if(!res.ok) throw new Error('firebase set failed: ' + res.status);
    return;
  }
  if(BACKEND.mode === 'sheets'){
    // Apps Script web apps need text/plain to avoid a CORS preflight.
    const res = await fetch(BACKEND.sheetsUrl, {
      method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ action:'set', data: stateObj })
    });
    if(!res.ok) throw new Error('sheets set failed: ' + res.status);
    return;
  }
  throw new Error('Unknown BACKEND.mode: ' + BACKEND.mode);
}

function blankHolesLocal18(){ return Array.from({length:18}, ()=>null); }

const ROUND_RATING_SLOPE_DEFAULTS = { r1:{rating:69.9, slope:133}, r2:{rating:69.7, slope:132}, r3:{rating:69.8, slope:129} };

function normalizeState(s){
  if(!s || typeof s !== 'object') return defaultState();
  if(!Array.isArray(s.players)) s.players = [];
  s.players = s.players.map(p=>({
    name: (p && p.name) || 'Player',
    handicap: (p && Number(p.handicap)) || 0
  }));
  if(!Array.isArray(s.rounds)) s.rounds = defaultState().rounds;
  s.rounds = s.rounds.map(r=>({
    id: r.id,
    label: r.label || r.id,
    course: r.course || '',
    date: r.date || '',
    format: r.format || 'stroke',
    visible: r.visible !== false,
    rating: (r.rating !== undefined && r.rating !== null && r.rating !== '') ? Number(r.rating) : ((ROUND_RATING_SLOPE_DEFAULTS[r.id] && ROUND_RATING_SLOPE_DEFAULTS[r.id].rating) || null),
    slope: (r.slope !== undefined && r.slope !== null && r.slope !== '') ? Number(r.slope) : ((ROUND_RATING_SLOPE_DEFAULTS[r.id] && ROUND_RATING_SLOPE_DEFAULTS[r.id].slope) || null),
    par: Array.isArray(r.par) && r.par.length===18 ? r.par : blankHolesLocal18(),
    hcpIndex: Array.isArray(r.hcpIndex) && r.hcpIndex.length===18 ? r.hcpIndex : blankHolesLocal18(),
    groups: Array.isArray(r.groups) ? r.groups : [],
    quads: Array.isArray(r.quads) ? r.quads : [],
    pairs: Array.isArray(r.pairs) ? r.pairs : [],
    teeGroups: Array.isArray(r.teeGroups) ? r.teeGroups : [],
    kpHoles: Array.isArray(r.kpHoles) ? r.kpHoles : ((ROUND_KP_LD_DEFAULTS[r.id] && ROUND_KP_LD_DEFAULTS[r.id].kp.slice()) || []),
    ldHoles: Array.isArray(r.ldHoles) ? r.ldHoles : ((ROUND_KP_LD_DEFAULTS[r.id] && ROUND_KP_LD_DEFAULTS[r.id].ld.slice()) || []),
    logoUrl: r.logoUrl || '',
    useCourseHandicap: (r.useCourseHandicap === true || r.useCourseHandicap === false) ? r.useCourseHandicap : null,
    handicapOverrides: (r.handicapOverrides && typeof r.handicapOverrides === 'object') ? r.handicapOverrides : {}
  }));
  if(!s.scores || typeof s.scores !== 'object') s.scores = {};
  if(!s.kp || typeof s.kp !== 'object') s.kp = {};
  if(!s.ld || typeof s.ld !== 'object') s.ld = {};
  if(typeof s.useCourseHandicap !== 'boolean') s.useCourseHandicap = false;
  if(!s.name) s.name = 'Golf Tournament';
  if(!s.tournamentImageUrl) s.tournamentImageUrl = '';
  return s;
}

async function loadState(){
  try{
    const data = await backendGet();
    state = normalizeState(data);
    if(!data) await saveState();
  }catch(e){
    console.error('load failed', e);
    state = defaultState();
    try{ await saveState(); }catch(e2){ console.error('initial save failed', e2); }
  }
  if(!entrySel.player && state.players.length) entrySel.player = state.players[0].name;
  render();
}

async function saveState(){
  try{ await backendSet(state); }
  catch(e){ console.error('save failed', e); }
}

function getRound(id){ return state.rounds.find(r=>r.id===id); }
function sortedPlayers(){ return [...state.players].sort((a,b)=>a.name.localeCompare(b.name)); }
function scoreKey(roundId, player, hole){ return `${roundId}__${player}__${hole}`; }
function kpKey(roundId, player, hole){ return `${roundId}__${player}__${hole}`; }
function ldKey(roundId, player, hole){ return `${roundId}__${player}__${hole}`; }
function getScore(roundId, player, hole){
  const v = state.scores[scoreKey(roundId, player, hole)];
  return (v===undefined || v===null || v==='') ? null : Number(v);
}

// --- Handicap strokes received on a given hole, based on hole's stroke index (1=hardest) ---
function strokesReceived(handicap, hcpIndexOfHole){
  if(!handicap || handicap <= 0 || !hcpIndexOfHole) return 0;
  const h = Math.round(handicap);
  const base = Math.floor(h/18);
  const remainder = h % 18;
  return base + (hcpIndexOfHole <= remainder ? 1 : 0);
}

// Converts a Handicap Index into a Course Handicap for a specific round,
// using the standard formula: Index × (Slope / 113) + (Rating − Par).
// Falls back to the index as-is if rating/slope/par aren't fully set up yet.
function courseHandicap(round, handicapIndex){
  const idx = Number(handicapIndex) || 0;
  const rating = Number(round.rating);
  const slope = Number(round.slope);
  const par = round.par && round.par.length ? round.par.reduce((a,b)=>a+(Number(b)||0),0) : 0;
  if(!rating || !slope || !par) return idx;
  return Math.round(idx * (slope/113) + (rating - par));
}

// Whether this round should use Course Handicap: round-level setting wins if explicitly
// set (true/false); otherwise falls back to the tournament-wide default.
function roundUsesCourseHandicap(round){
  if(round.useCourseHandicap === true) return true;
  if(round.useCourseHandicap === false) return false;
  return !!state.useCourseHandicap;
}

// A player's handicap for a specific round: uses that round's override if set,
// otherwise falls back to the player's base handicap from Setup.
function effectiveHandicapIndex(round, playerName){
  const override = round.handicapOverrides ? round.handicapOverrides[playerName] : undefined;
  if(override !== undefined && override !== null && override !== '') return Number(override);
  const p = state.players.find(pl=>pl.name===playerName);
  return p ? Number(p.handicap)||0 : 0;
}

// The actual number of strokes applied for a player in a round, after resolving
// per-round handicap overrides and the Course Handicap toggle.
function playerRoundHandicap(round, playerName){
  const idx = effectiveHandicapIndex(round, playerName);
  return roundUsesCourseHandicap(round) ? courseHandicap(round, idx) : idx;
}

function roundGrossTotal(roundId, player){
  const round = getRound(roundId);
  let total=0, count=0, parSum=0, parCount=0;
  for(let h=1; h<=18; h++){
    const v = getScore(roundId, player, h);
    if(v!==null){
      total+=v; count++;
      const par = round.par[h-1];
      if(par!==null && par!==undefined && par!==''){ parSum += Number(par); parCount++; }
    }
  }
  const toPar = (count>0 && parCount===count) ? total - parSum : null;
  return {total, count, toPar};
}

function roundNetTotal(roundId, player){
  const round = getRound(roundId);
  const hcp = playerRoundHandicap(round, player);
  let total=0, count=0, parSum=0, parCount=0;
  for(let h=1; h<=18; h++){
    const v = getScore(roundId, player, h);
    if(v!==null){
      const hi = round.hcpIndex[h-1];
      total += v - strokesReceived(hcp, hi ? Number(hi) : null);
      count++;
      const par = round.par[h-1];
      if(par!==null && par!==undefined && par!==''){ parSum += Number(par); parCount++; }
    }
  }
  const toPar = (count>0 && parCount===count) ? total - parSum : null;
  return {total, count, toPar};
}

// --- Individual Sixes: rotating 1-on-1 net-score matchups within a foursome ---
// partnerOrder[segment] = which slot (1,2,or3) pairs with slot 0 during that 6-hole segment.
// The other two slots automatically pair with each other.
function quadPairsForSegment(quad, segIdx){
  const partnerSlot = quad.partnerOrder[segIdx];
  const otherSlots = [1,2,3].filter(s=>s!==partnerSlot);
  return [
    [quad.players[0], quad.players[partnerSlot]],
    [quad.players[otherSlots[0]], quad.players[otherSlots[1]]]
  ];
}

function netHoleScore(round, player, hole){
  const gross = getScore(round.id, player, hole);
  if(gross===null) return null;
  const hcp = playerRoundHandicap(round, player);
  const hi = round.hcpIndex[hole-1];
  return gross - strokesReceived(hcp, hi ? Number(hi) : null);
}

function sixesTotalsForRound(roundId){
  const round = getRound(roundId);
  const totals = {};
  state.players.forEach(p=>totals[p.name]=0);
  (round.quads||[]).forEach(quad=>{
    if(quad.players.filter(Boolean).length !== 4) return;
    for(let seg=0; seg<3; seg++){
      const pairs = quadPairsForSegment(quad, seg);
      const holeStart = seg*6+1, holeEnd = seg*6+6;
      for(let h=holeStart; h<=holeEnd; h++){
        pairs.forEach(([pa,pb])=>{
          if(!pa || !pb) return;
          const sa = netHoleScore(round, pa, h), sb = netHoleScore(round, pb, h);
          if(sa===null || sb===null) return;
          if(sa < sb) totals[pa] = (totals[pa]||0) + 2;
          else if(sb < sa) totals[pb] = (totals[pb]||0) + 2;
          else { totals[pa] = (totals[pa]||0) + 1; totals[pb] = (totals[pb]||0) + 1; }
        });
      }
    }
  });
  return totals;
}

// --- Team Pairs: best-ball gross + best-ball net, per hole, summed over the round ---
function pairsTotalsForRound(roundId){
  const round = getRound(roundId);
  const results = [];
  (round.pairs||[]).forEach((pair, pi)=>{
    if(pair.players.filter(Boolean).length !== 2) return;
    const [a,b] = pair.players;
    let total = 0, count = 0;
    for(let h=1; h<=18; h++){
      const ga = getScore(round.id, a, h), gb = getScore(round.id, b, h);
      if(ga===null || gb===null) continue;
      const na = netHoleScore(round, a, h), nb = netHoleScore(round, b, h);
      if(na===null || nb===null) continue;
      total += Math.min(ga, gb) + Math.min(na, nb);
      count++;
    }
    results.push({ id: pair.id || `pair-${pi}`, label: `${a} & ${b}`, total, count });
  });
  return results;
}

// --- Daily Closest-to-Pin: all entries across the round's KP holes, sorted shortest-first ---
function kpLeaderboardForRound(roundId){
  const round = getRound(roundId);
  const entries = [];
  (round.kpHoles||[]).forEach(hole=>{
    state.players.forEach(p=>{
      const e = state.kp[kpKey(roundId, p.name, hole)];
      if(!e) return;
      const feet = (e.feet===null || e.feet===undefined || e.feet==='') ? null : Number(e.feet);
      const inches = (e.inches===null || e.inches===undefined || e.inches==='') ? null : Number(e.inches);
      if(feet===null && inches===null) return;
      const total = (feet||0)*12 + (inches||0);
      entries.push({ player: p.name, hole, feet: feet||0, inches: inches||0, total });
    });
  });
  return entries.sort((a,b)=> a.total - b.total);
}

// --- Daily Longest Drive: most recently checked "LD?" box across the round's LD holes ---
function ldLeaderboardForRound(roundId){
  const round = getRound(roundId);
  let best = null;
  (round.ldHoles||[]).forEach(hole=>{
    state.players.forEach(p=>{
      const e = state.ld[ldKey(roundId, p.name, hole)];
      if(!e || !e.checked) return;
      if(!best || (e.ts||0) > (best.ts||0)) best = { player: p.name, hole, ts: e.ts||0 };
    });
  });
  return best;
}

function render(){
  document.getElementById('tournamentName').textContent = state.name;
  const roundsInfo = state.rounds.map(r=>r.course).join(' · ');
  document.getElementById('headerSub').textContent = `${state.players.length} players · ${roundsInfo}`;
  const imgEl = document.getElementById('tournamentImage');
  if(state.tournamentImageUrl){
    imgEl.src = state.tournamentImageUrl;
    imgEl.alt = state.name;
    imgEl.style.display = 'block';
  } else {
    imgEl.style.display = 'none';
  }
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('active', b.dataset.tab===currentTab));
  const main = document.getElementById('main');
  if(currentTab==='leaderboard') main.innerHTML = renderLeaderboard();
  else if(currentTab==='enter') main.innerHTML = renderEnter();
  else main.innerHTML = renderSetup();
  attachHandlers();
}

function fmtSigned(n){
  if(n>0) return `+${n}`;
  if(n===0) return 'E';
  return `${n}`;
}

function scoreCellHtml(count, total, toPar){
  if(count===0) return `<span class="lb-score-wrap"><span class="lb-score dim">—</span></span>`;
  const toParHtml = toPar!==null && toPar!==undefined
    ? `<span class="lb-topar ${toPar<0?'under':toPar>0?'over':'even'}">(${fmtSigned(toPar)})</span>`
    : '';
  return `<span class="lb-score-wrap"><span class="lb-score">${total}</span>${toParHtml}</span>`;
}

function renderLeaderboard(){
  const visRounds = state.rounds.filter(r=>r.visible!==false);
  const tabs = `<div class="toplevel-tabs">
    <button data-lb="overall" class="${lbView==='overall'?'active':''}">OVERALL</button>
    ${visRounds.map(r=>`<button data-lb="${r.id}" class="${lbView===r.id?'active':''}">${r.label.toUpperCase()}</button>`).join('')}
  </div>`;

  if(!state.players.length) return tabs + `<div class="empty-state">No players yet. Add players in Setup.</div>`;

  if(lbView!=='overall' && !visRounds.some(r=>r.id===lbView)){
    lbView = 'overall';
  }

  if(lbView==='overall'){
    const gross = state.players.map(p=>{
      let total=0, count=0, parSum=0, anyMissingPar=false;
      visRounds.forEach(r=>{
        const {total:t, count:c, toPar} = roundGrossTotal(r.id, p.name);
        total+=t; count+=c;
        if(c>0){ if(toPar===null) anyMissingPar=true; else parSum+=toPar; }
      });
      return {name:p.name, total, count, toPar: (count>0 && !anyMissingPar) ? parSum : null};
    }).sort((a,b)=> (a.count===0)-(b.count===0) || a.total-b.total);

    const net = state.players.map(p=>{
      let total=0, count=0, parSum=0, anyMissingPar=false;
      visRounds.forEach(r=>{
        const {total:t, count:c, toPar} = roundNetTotal(r.id, p.name);
        total+=t; count+=c;
        if(c>0){ if(toPar===null) anyMissingPar=true; else parSum+=toPar; }
      });
      return {name:p.name, total, count, toPar: (count>0 && !anyMissingPar) ? parSum : null};
    }).sort((a,b)=> (a.count===0)-(b.count===0) || a.total-b.total);

    return tabs + `
      <h2 class="section-title">Overall — Gross</h2>
      <div class="card">${gross.map((r,i)=>`
        <div class="lb-row">
          <span class="lb-rank">${r.count===0?'–':i+1}</span>
          <span class="lb-name">${escapeHtml(r.name)}</span>
          ${scoreCellHtml(r.count, r.total, r.toPar)}
        </div>`).join('')}
      </div>
      <h2 class="section-title">Overall — Net</h2>
      <div class="card">${net.map((r,i)=>`
        <div class="lb-row">
          <span class="lb-rank">${r.count===0?'–':i+1}</span>
          <span class="lb-name">${escapeHtml(r.name)}</span>
          ${scoreCellHtml(r.count, r.total, r.toPar)}
        </div>`).join('')}
      </div>
      <p class="muted">Net = gross minus handicap strokes allocated per hole. To-par shows once par is entered for every hole played, in Setup.</p>
      <h2 class="section-title">Handicaps</h2>
      <div class="card">${[...state.players].sort((a,b)=> (Number(a.handicap)||0) - (Number(b.handicap)||0)).map((p,i)=>`
        <div class="lb-row">
          <span class="lb-rank">${i+1}</span>
          <span class="lb-name">${escapeHtml(p.name)}</span>
          <span class="lb-score">${Number(p.handicap)||0}</span>
        </div>`).join('')}
      </div>
    `;
  } else {
    const round = getRound(lbView);
    const gross = state.players.map(p=>{
      const {total,count,toPar} = roundGrossTotal(round.id, p.name);
      return {name:p.name, total, count, toPar};
    }).sort((a,b)=> (a.count===0)-(b.count===0) || a.total-b.total);
    const net = state.players.map(p=>{
      const {total,count,toPar} = roundNetTotal(round.id, p.name);
      return {name:p.name, total, count, toPar};
    }).sort((a,b)=> (a.count===0)-(b.count===0) || a.total-b.total);

    let sixesHtml = '';
    if(round.format==='sixes'){
      const totals = sixesTotalsForRound(round.id);
      const rows = state.players.map(p=>({name:p.name, pts: totals[p.name]||0}))
        .sort((a,b)=>b.pts-a.pts);
      const hasGroups = (round.quads||[]).some(q=>q.players.filter(Boolean).length===4);
      sixesHtml = `<h2 class="section-title">${escapeHtml(round.label)} — Individual Sixes Points</h2>
        <div class="card">
        ${hasGroups ? rows.map((r,i)=>`
          <div class="lb-row">
            <span class="lb-rank">${i+1}</span>
            <span class="lb-name">${escapeHtml(r.name)}</span>
            <span class="lb-score">${r.pts}</span>
          </div>`).join('') : `<div class="muted">Set up your foursomes for this round in Setup to see points.</div>`}
        </div>`;
    }

    let pairsHtml = '';
    if(round.format==='pairs'){
      const teamResults = pairsTotalsForRound(round.id)
        .sort((a,b)=> (a.count===0)-(b.count===0) || a.total-b.total);
      const hasPairs = (round.pairs||[]).some(p=>p.players.filter(Boolean).length===2);
      pairsHtml = `<h2 class="section-title">${escapeHtml(round.label)} — Team Score (Best Ball Gross + Net)</h2>
        <div class="card">
        ${hasPairs ? teamResults.map((r,i)=>`
          <div class="lb-row">
            <span class="lb-rank">${r.count===0?'–':i+1}</span>
            <span class="lb-name">${escapeHtml(r.label)}</span>
            <span class="lb-score ${r.count===0?'dim':''}">${r.count===0?'—':r.total}</span>
          </div>`).join('') : `<div class="muted">Set up your pairs for this round in Setup to see team scores.</div>`}
        </div>
        <p class="muted">Each hole: lower of the pair's two gross scores, plus lower of their two net scores. Summed over 18 — lowest total wins.</p>`;
    }

    const kpEntries = kpLeaderboardForRound(round.id);
    const ldBest = ldLeaderboardForRound(round.id);
    const hasKpLd = (round.kpHoles||[]).length > 0 || (round.ldHoles||[]).length > 0;
    let kpLdHtml = '';
    if(hasKpLd){
      const ldValue = ldBest
        ? `${escapeHtml(ldBest.player)} (Hole ${ldBest.hole})`
        : '<span class="muted">No entries yet</span>';
      kpLdHtml = `<h2 class="section-title">Daily KP and LD</h2>
        <div class="card kp-ld-card">
          <div class="kp-ld-row">
            <span class="kp-ld-label">LONGEST DRIVE</span>
            <span class="kp-ld-value">${ldValue}</span>
          </div>
        </div>
        <div class="card">
          <div class="kp-ld-label" style="margin-bottom:8px;">CLOSEST TO PIN — ALL ENTRIES</div>
          ${kpEntries.length ? kpEntries.map((e,i)=>`
            <div class="lb-row">
              <span class="lb-rank">${i+1}</span>
              <span class="lb-name">${escapeHtml(e.player)} <span class="tag">Hole ${e.hole}</span></span>
              <span class="lb-score">${e.feet}' ${e.inches}"</span>
            </div>`).join('') : `<div class="muted">No entries yet</div>`}
        </div>`;
    }

    const logoHtml = round.logoUrl
      ? `<div style="text-align:center; margin-bottom:16px;"><img src="${escapeAttr(round.logoUrl)}" alt="${escapeAttr(round.course)}" style="max-height:90px; max-width:100%; border-radius:6px;"></div>`
      : '';

    return tabs + `
      ${logoHtml}
      ${kpLdHtml}
      ${pairsHtml}
      <h2 class="section-title">${escapeHtml(round.label)} — ${escapeHtml(round.course)} · Gross</h2>
      <div class="card">${gross.map((r,i)=>`
        <div class="lb-row">
          <span class="lb-rank">${r.count===0?'–':i+1}</span>
          <span class="lb-name">${escapeHtml(r.name)}</span>
          ${scoreCellHtml(r.count, r.total, r.toPar)}
        </div>`).join('')}
      </div>
      <h2 class="section-title">${escapeHtml(round.label)} — Net</h2>
      <div class="card">${net.map((r,i)=>`
        <div class="lb-row">
          <span class="lb-rank">${r.count===0?'–':i+1}</span>
          <span class="lb-name">${escapeHtml(r.name)}</span>
          ${scoreCellHtml(r.count, r.total, r.toPar)}
        </div>`).join('')}
      </div>
      ${sixesHtml}
    `;
  }
}

function myTeeGroup(round){
  const groups = round.teeGroups || [];
  if(!groups.length) return null; // no lock configured for this round
  const myId = localStorage.getItem(`myTeeGroupId_${round.id}`);
  if(!myId) return undefined; // no selection made yet for this round
  return groups.find(g=>g.id===myId) || undefined;
}

function renderGroupPicker(round, visRounds){
  const groups = round.teeGroups || [];
  return `
    <h2 class="section-title">Select Your Foursome</h2>
    <div class="card">
      <label>Round</label>
      <select id="pickerRoundSelect">
        ${visRounds.map(r=>`<option value="${r.id}" ${r.id===round.id?'selected':''}>${escapeHtml(r.label)} — ${escapeHtml(r.course)}</option>`).join('')}
      </select>
      <p class="muted" style="margin:10px 0 0;">Pick the group you're playing in for ${escapeHtml(round.label)}. This phone will only be able to enter scores for these 4 players, for this round.</p>
    </div>
    <div class="card">
      ${groups.map(g=>`
        <button class="btn secondary" data-pick-teegroup="${g.id}" style="margin-bottom:10px; text-align:left; padding:14px 16px;">
          <div style="font-family:'Oswald',sans-serif; font-size:15px; margin-bottom:4px;">${escapeHtml(g.name || 'Group')}</div>
          <div style="font-size:12px; opacity:0.75; font-family:'IBM Plex Sans',sans-serif;">${g.players.filter(Boolean).map(escapeHtml).join(', ') || 'No players set'}</div>
        </button>`).join('')}
    </div>
  `;
}

function renderEnter(){
  if(!state.players.length) return `<div class="empty-state">Add players in Setup first.</div>`;
  const visRounds = state.rounds.filter(r=>r.visible!==false);
  if(!visRounds.length) return `<div class="empty-state">No rounds are visible yet. Check back once the organizer opens one up.</div>`;
  if(!visRounds.some(r=>r.id===entrySel.round)) entrySel.round = visRounds[0].id;
  const round = getRound(entrySel.round);

  const myGroup = myTeeGroup(round);
  if(myGroup === undefined) return renderGroupPicker(round, visRounds);

  const allowedPlayers = myGroup ? sortedPlayers().filter(p=>myGroup.players.includes(p.name)) : sortedPlayers();
  if(myGroup && !allowedPlayers.some(p=>p.name===entrySel.player)){
    entrySel.player = allowedPlayers.length ? allowedPlayers[0].name : '';
  }

  const modeToggle = `<div class="toplevel-tabs">
    <button data-entry-mode="player" class="${entryMode==='player'?'active':''}">BY PLAYER</button>
    <button data-entry-mode="hole" class="${entryMode==='hole'?'active':''}">BY HOLE</button>
  </div>`;

  const roundPicker = `
    <div class="card">
      <label>Round</label>
      <select id="roundSelect">
        ${visRounds.map(r=>`<option value="${r.id}" ${r.id===round.id?'selected':''}>${escapeHtml(r.label)} — ${escapeHtml(r.course)}</option>`).join('')}
      </select>
      ${myGroup ? `<button class="btn secondary" id="switchGroupBtn" style="margin-top:4px;">Not ${escapeHtml(myGroup.name || 'this group')}? Switch group</button>` : ''}
    </div>`;

  if(entryMode === 'hole'){
    return modeToggle + roundPicker + renderEnterByHole(round, allowedPlayers, myGroup);
  }
  return modeToggle + roundPicker + renderEnterByPlayer(round, allowedPlayers);
}

function renderEnterByPlayer(round, allowedPlayers){
  const player = entrySel.player;
  let rows = '';
  for(let h=1; h<=18; h++){
    const existing = getScore(round.id, player, h);
    const par = round.par[h-1];
    const isKp = (round.kpHoles||[]).includes(h);
    const isLd = (round.ldHoles||[]).includes(h);
    let extraHtml = '';
    if(isKp){
      const kpEntry = state.kp[kpKey(round.id, player, h)] || {};
      extraHtml += `<div class="hole-extra">
        <span>KP</span>
        <input type="number" inputmode="numeric" data-kp-feet="${h}" placeholder="ft" value="${kpEntry.feet!==undefined && kpEntry.feet!==null?kpEntry.feet:''}">
        <span>ft</span>
        <input type="number" inputmode="numeric" data-kp-inches="${h}" placeholder="in" value="${kpEntry.inches!==undefined && kpEntry.inches!==null?kpEntry.inches:''}">
        <span>in</span>
      </div>`;
    }
    if(isLd){
      const ldEntry = state.ld[ldKey(round.id, player, h)] || {};
      extraHtml += `<div class="hole-extra">
        <label><input type="checkbox" data-ld-check="${h}" ${ldEntry.checked?'checked':''}> LD?</label>
      </div>`;
    }
    rows += `
      <div class="hole-row" data-hole-row="${h}">
        <span class="hole-row-num">${h}</span>
        <span class="hole-row-par">${par ? `Par ${par}` : ''}</span>
        <input type="number" inputmode="numeric" class="hole-row-input" data-live-hole="${h}" value="${existing!==null?existing:''}" placeholder="-">
        <button class="clear-x" data-clear-hole="${h}" title="Clear" style="${existing!==null?'':'visibility:hidden;'}">&times;</button>
        <span class="hole-row-status" data-status-key="${player}__${h}"></span>
        ${extraHtml}
      </div>`;
  }

  return `
    <div class="card">
      <label>Player</label>
      <select id="playerSelect">
        ${allowedPlayers.map(p=>`<option value="${escapeAttr(p.name)}" ${p.name===player?'selected':''}>${escapeHtml(p.name)}</option>`).join('')}
      </select>
    </div>
    <div class="card hole-list">
      ${rows}
    </div>
    <p class="muted">Scores save automatically as you type — no need to press anything.</p>
  `;
}

function renderEnterByHole(round, allowedPlayers, myGroup){
  if(!entrySel.hole || entrySel.hole < 1 || entrySel.hole > 18) entrySel.hole = 1;
  const hole = entrySel.hole;
  const par = round.par[hole-1];
  const isKp = (round.kpHoles||[]).includes(hole);
  const isLd = (round.ldHoles||[]).includes(hole);

  const rows = allowedPlayers.map(p=>{
    const existing = getScore(round.id, p.name, hole);
    let extraHtml = '';
    if(isKp){
      const kpEntry = state.kp[kpKey(round.id, p.name, hole)] || {};
      extraHtml += `<div class="hole-extra">
        <span>KP</span>
        <input type="number" inputmode="numeric" data-kp-feet-player="${escapeAttr(p.name)}" placeholder="ft" value="${kpEntry.feet!==undefined && kpEntry.feet!==null?kpEntry.feet:''}">
        <span>ft</span>
        <input type="number" inputmode="numeric" data-kp-inches-player="${escapeAttr(p.name)}" placeholder="in" value="${kpEntry.inches!==undefined && kpEntry.inches!==null?kpEntry.inches:''}">
        <span>in</span>
      </div>`;
    }
    if(isLd){
      const ldEntry = state.ld[ldKey(round.id, p.name, hole)] || {};
      extraHtml += `<div class="hole-extra">
        <label><input type="checkbox" data-ld-check-player="${escapeAttr(p.name)}" ${ldEntry.checked?'checked':''}> LD?</label>
      </div>`;
    }
    return `
      <div class="hole-row" data-hole-row-player="${escapeAttr(p.name)}">
        <span class="hole-row-num" style="width:auto; flex:1; text-align:left; font-family:'IBM Plex Sans',sans-serif; font-size:15px; color:var(--cream);">${escapeHtml(p.name)}</span>
        <input type="number" inputmode="numeric" class="hole-row-input" style="flex:0 0 70px;" data-live-player="${escapeAttr(p.name)}" value="${existing!==null?existing:''}" placeholder="-">
        <button class="clear-x" data-clear-player="${escapeAttr(p.name)}" title="Clear" style="${existing!==null?'':'visibility:hidden;'}">&times;</button>
        <span class="hole-row-status" data-status-key="${p.name}__${hole}"></span>
        ${extraHtml}
      </div>`;
  }).join('');

  return `
    <div class="card">
      <div style="display:flex; align-items:center; justify-content:space-between;">
        <button class="btn secondary" id="prevHoleBtn" style="width:auto; padding:10px 16px;" ${hole<=1?'disabled':''}>&larr; Prev</button>
        <div style="text-align:center;">
          <div style="font-family:'Oswald',sans-serif; font-size:24px; color:var(--amber);">Hole ${hole}</div>
          <div class="muted">${par ? `Par ${par}` : ''}</div>
        </div>
        <button class="btn secondary" id="nextHoleBtn" style="width:auto; padding:10px 16px;" ${hole>=18?'disabled':''}>Next &rarr;</button>
      </div>
    </div>
    <div class="card hole-list">
      ${allowedPlayers.length ? rows : `<div class="empty-state">${myGroup ? 'No players in your group.' : 'No players yet.'}</div>`}
    </div>
    <p class="muted">Scores save automatically as you type — no need to press anything.</p>
  `;
}

              <option value="">— select player —</option>
              ${sortedPlayers().map(p=>`<option value="${escapeAttr(p.name)}" ${pair.players[slot]===p.name?'selected':''}>${escapeHtml(p.name)}</option>`).join('')}

      });
      html += `<button class="btn secondary" data-add-pair="${round.id}">Add Pair</button></div></details>`;
    }
  });

  html += `<h2 class="section-title">Backup</h2>
  <div class="card">
    <button class="btn secondary" id="exportBtn">Download Backup (.json)</button>

  </div>`;

  html += `<div class="muted" style="text-align:center; margin-top:16px;">Everyone using this link shares the same live data.</div>`;
  return html;
}

function attachHandlers(){
  document.querySelectorAll('nav.tabs button').forEach(b=>{
    b.onclick = ()=>{
      const tab = b.dataset.tab;
      if(tab === 'setup' && sessionStorage.getItem('setupUnlocked') !== 'true'){
        const entered = prompt('Enter organizer PIN to access Setup:');
        if(entered === null) return; // cancelled
        if(entered !== SETUP_PIN){
          alert('Incorrect PIN.');
          return;
        }
        sessionStorage.setItem('setupUnlocked', 'true');
      }
      currentTab = tab;
      render();
    };
  });

  document.querySelectorAll('[data-details-key]').forEach(el=>{
    el.ontoggle = ()=>{ uiDetailsState[el.dataset.detailsKey] = el.open; };
  });

  if(currentTab==='leaderboard'){
    document.querySelectorAll('[data-lb]').forEach(b=>{
      b.onclick = ()=>{ lbView=b.dataset.lb; render(); };
    });
  }

  if(currentTab==='enter'){
    const pickerRoundSelect = document.getElementById('pickerRoundSelect');
    if(pickerRoundSelect) pickerRoundSelect.onchange = e=>{ entrySel.round = e.target.value; render(); };

    document.querySelectorAll('[data-pick-teegroup]').forEach(btn=>{
      btn.onclick = ()=>{
        localStorage.setItem(`myTeeGroupId_${entrySel.round}`, btn.dataset.pickTeegroup);
        entrySel.player = '';
        render();
      };
    });
    const switchGroupBtn = document.getElementById('switchGroupBtn');
    if(switchGroupBtn) switchGroupBtn.onclick = ()=>{
      if(!confirm('Switch to a different foursome for this round on this phone?')) return;
      localStorage.removeItem(`myTeeGroupId_${entrySel.round}`);
      render();
    };

    document.querySelectorAll('[data-entry-mode]').forEach(btn=>{
      btn.onclick = ()=>{ entryMode = btn.dataset.entryMode; render(); };
    });

    const roundSelect = document.getElementById('roundSelect');
    const playerSelect = document.getElementById('playerSelect');
    if(roundSelect) roundSelect.onchange = e=>{ entrySel.round=e.target.value; render(); };
    if(playerSelect) playerSelect.onchange = e=>{ entrySel.player=e.target.value; render(); };

    const prevHoleBtn = document.getElementById('prevHoleBtn');
    const nextHoleBtn = document.getElementById('nextHoleBtn');
    if(prevHoleBtn) prevHoleBtn.onclick = ()=>{ if(entrySel.hole>1){ entrySel.hole--; render(); } };
    if(nextHoleBtn) nextHoleBtn.onclick = ()=>{ if(entrySel.hole<18){ entrySel.hole++; render(); } };

    // By-player mode: one player fixed, looping over all 18 holes
    document.querySelectorAll('[data-live-hole]').forEach(input=>{
      input.oninput = ()=>{
        const hole = Number(input.dataset.liveHole);
        const clearBtn = document.querySelector(`[data-clear-hole="${hole}"]`);
        if(clearBtn) clearBtn.style.visibility = input.value==='' ? 'hidden' : 'visible';
        scheduleHoleSave(entrySel.round, entrySel.player, hole, input.value);
      };
    });
    document.querySelectorAll('[data-clear-hole]').forEach(btn=>{
      btn.onclick = ()=>{
        const hole = Number(btn.dataset.clearHole);
        const input = document.querySelector(`[data-live-hole="${hole}"]`);
        if(input) input.value = '';
        btn.style.visibility = 'hidden';
        scheduleHoleSave(entrySel.round, entrySel.player, hole, '', true);
      };
    });
    document.querySelectorAll('[data-kp-feet]').forEach(inp=>{
      inp.oninput = ()=> scheduleKpSave(entrySel.round, entrySel.player, Number(inp.dataset.kpFeet), 'feet', inp.value);
    });
    document.querySelectorAll('[data-kp-inches]').forEach(inp=>{
      inp.oninput = ()=> scheduleKpSave(entrySel.round, entrySel.player, Number(inp.dataset.kpInches), 'inches', inp.value);
    });
    document.querySelectorAll('[data-ld-check]').forEach(cb=>{
      cb.onchange = ()=> saveLdCheck(entrySel.round, entrySel.player, Number(cb.dataset.ldCheck), cb.checked);
    });

    // By-hole mode: one hole fixed, looping over all players in the group
    document.querySelectorAll('[data-live-player]').forEach(input=>{
      input.oninput = ()=>{
        const player = input.dataset.livePlayer;
        const clearBtn = document.querySelector(`[data-clear-player="${CSS.escape(player)}"]`);
        if(clearBtn) clearBtn.style.visibility = input.value==='' ? 'hidden' : 'visible';
        scheduleHoleSave(entrySel.round, player, entrySel.hole, input.value);
      };
    });
    document.querySelectorAll('[data-clear-player]').forEach(btn=>{
      btn.onclick = ()=>{
        const player = btn.dataset.clearPlayer;
        const input = document.querySelector(`[data-live-player="${CSS.escape(player)}"]`);
        if(input) input.value = '';
        btn.style.visibility = 'hidden';
        scheduleHoleSave(entrySel.round, player, entrySel.hole, '', true);
      };
    });
    document.querySelectorAll('[data-kp-feet-player]').forEach(inp=>{
      inp.oninput = ()=> scheduleKpSave(entrySel.round, inp.dataset.kpFeetPlayer, entrySel.hole, 'feet', inp.value);
    });
    document.querySelectorAll('[data-kp-inches-player]').forEach(inp=>{
      inp.oninput = ()=> scheduleKpSave(entrySel.round, inp.dataset.kpInchesPlayer, entrySel.hole, 'inches', inp.value);
    });
    document.querySelectorAll('[data-ld-check-player]').forEach(cb=>{
      cb.onchange = ()=> saveLdCheck(entrySel.round, cb.dataset.ldCheckPlayer, entrySel.hole, cb.checked);
    });
  }

  if(currentTab==='setup'){
    const saveNameBtn = document.getElementById('saveName');
    if(saveNameBtn) saveNameBtn.onclick = async ()=>{
      state.name = document.getElementById('nameInput').value || 'Tournament';
      await saveState(); render();
    };
    const saveTournamentImageBtn = document.getElementById('saveTournamentImage');
    if(saveTournamentImageBtn) saveTournamentImageBtn.onclick = async ()=>{
      state.tournamentImageUrl = document.getElementById('tournamentImageInput').value.trim();
      await saveState(); render();
    };
    const globalUseCourseHandicapCb = document.getElementById('globalUseCourseHandicap');
    if(globalUseCourseHandicapCb) globalUseCourseHandicapCb.onchange = async ()=>{

      await saveState(); render();
    };

    if(addPlayerBtn) addPlayerBtn.onclick = async ()=>{
      const name = document.getElementById('newPlayerInput').value.trim();
      const hcp = Number(document.getElementById('newPlayerHcp').value) || 0;
      if(!name) return;
      state.players.push({name, handicap: hcp});
      await saveState(); render();
    };

    document.querySelectorAll('[data-copy-quads-to-teegroups]').forEach(btn=>{
      btn.onclick = async ()=>{
        const round = getRound(btn.dataset.copyQuadsToTeegroups);
        const validQuads = (round.quads||[]).filter(q=>q.players.filter(Boolean).length===4);

          alert('This round\'s foursomes aren\'t set up yet — use "Load Round 1 Roster & Matchups" first, or build Tee Groups manually below.');

        }
        round.teeGroups = validQuads.map((q,i)=>({
          id: 'teegroup-' + Date.now() + '-' + i,
          name: `Group ${i+1}`,
          players: q.players.slice()
        }));
        await saveState(); render();
      };
    });

      btn.onclick = async ()=>{
        const round = getRound(btn.dataset.addTeegroup);
        round.teeGroups.push({ id: 'teegroup-' + Date.now(), name: `Group ${round.teeGroups.length+1}`, players:['','','',''] });
        await saveState(); render();
      };
    });
    document.querySelectorAll('[data-remove-teegroup]').forEach(btn=>{
      btn.onclick = async ()=>{
        if(!confirm('Remove this tee group?')) return;
        const [rid, ti] = btn.dataset.removeTeegroup.split(':');
        getRound(rid).teeGroups.splice(Number(ti),1);
        await saveState(); render();
      };

    document.querySelectorAll('[data-teegroup-name]').forEach(inp=>{
      inp.onchange = async ()=>{
        const [rid, ti] = inp.dataset.teegroupName.split(':');
        getRound(rid).teeGroups[Number(ti)].name = inp.value;
        await saveState(); render();
      };
    });
    document.querySelectorAll('[data-teegroup-slot]').forEach(sel=>{
      sel.onchange = async ()=>{
        const [rid, ti, slot] = sel.dataset.teegroupSlot.split(':');
        getRound(rid).teeGroups[Number(ti)].players[Number(slot)] = sel.value;
        await saveState(); render();
      };
    });
    document.querySelectorAll('[data-remove-player]').forEach(btn=>{
      btn.onclick = async ()=>{
        const idx = Number(btn.dataset.removePlayer);
        const name = state.players[idx] ? state.players[idx].name : 'this player';
        if(!confirm(`Remove ${name}? This can't be undone and will affect any groups/foursomes they're in.`)) return;
        state.players.splice(idx,1);
        await saveState(); render();
      };
    });
    document.querySelectorAll('[data-hcp-index]').forEach(inp=>{
      inp.onchange = async ()=>{
        state.players[Number(inp.dataset.hcpIndex)].handicap = Number(inp.value)||0;
        await saveState();
      };
    });
    document.querySelectorAll('[data-round-course]').forEach(inp=>{
      inp.onchange = async ()=>{ getRound(inp.dataset.roundCourse).course = inp.value; await saveState(); render(); };
    });
    document.querySelectorAll('[data-round-logo]').forEach(inp=>{
      inp.onchange = async ()=>{ getRound(inp.dataset.roundLogo).logoUrl = inp.value.trim(); await saveState(); render(); };
    });
    document.querySelectorAll('[data-round-date]').forEach(inp=>{
      inp.onchange = async ()=>{ getRound(inp.dataset.roundDate).date = inp.value; await saveState(); };
    });
    document.querySelectorAll('[data-round-format]').forEach(sel=>{
      sel.onchange = async ()=>{ getRound(sel.dataset.roundFormat).format = sel.value; await saveState(); render(); };
    });
    document.querySelectorAll('[data-round-visible]').forEach(cb=>{
      cb.onchange = async ()=>{ getRound(cb.dataset.roundVisible).visible = cb.checked; await saveState(); render(); };
    });
    document.querySelectorAll('[data-round-usech]').forEach(sel=>{
      sel.onchange = async ()=>{
        const val = sel.value;

        await saveState(); render();
      };
    });
    document.querySelectorAll('[data-round-rating]').forEach(inp=>{
      inp.onchange = async ()=>{ getRound(inp.dataset.roundRating).rating = inp.value===''? null : Number(inp.value); await saveState(); render(); };
    });
    document.querySelectorAll('[data-round-slope]').forEach(inp=>{
      inp.onchange = async ()=>{ getRound(inp.dataset.roundSlope).slope = inp.value===''? null : Number(inp.value); await saveState(); render(); };
    });
    document.querySelectorAll('[data-hcp-override]').forEach(inp=>{
      inp.onchange = async ()=>{
        const [rid, playerName] = inp.dataset.hcpOverride.split(':');
        const round = getRound(rid);
        if(!round.handicapOverrides) round.handicapOverrides = {};
        if(inp.value === ''){ delete round.handicapOverrides[playerName]; }
        else { round.handicapOverrides[playerName] = Number(inp.value); }
        await saveState(); render();
      };
    });
    function parseHoleList(str){
      return str.split(',').map(s=>parseInt(s.trim(),10)).filter(n=>!isNaN(n) && n>=1 && n<=18);
    }
    document.querySelectorAll('[data-round-kpholes]').forEach(inp=>{
      inp.onchange = async ()=>{ getRound(inp.dataset.roundKpholes).kpHoles = parseHoleList(inp.value); await saveState(); render(); };
    });
    document.querySelectorAll('[data-round-ldholes]').forEach(inp=>{
      inp.onchange = async ()=>{ getRound(inp.dataset.roundLdholes).ldHoles = parseHoleList(inp.value); await saveState(); render(); };
    });
    document.querySelectorAll('[data-par]').forEach(inp=>{
      inp.onchange = async ()=>{
        const [rid, h] = inp.dataset.par.split(':');
        getRound(rid).par[Number(h)] = inp.value===''? null : Number(inp.value);
        await saveState();
      };
    });
    document.querySelectorAll('[data-hcpidx]').forEach(inp=>{
      inp.onchange = async ()=>{
        const [rid, h] = inp.dataset.hcpidx.split(':');
        getRound(rid).hcpIndex[Number(h)] = inp.value===''? null : Number(inp.value);
        await saveState();
      };
    });
    document.querySelectorAll('[data-add-quad]').forEach(btn=>{
      btn.onclick = async ()=>{
        getRound(btn.dataset.addQuad).quads.push({ players:['','','',''], partnerOrder:[2,3,1] });
        await saveState(); render();
      };
    });
    document.querySelectorAll('[data-remove-quad]').forEach(btn=>{
      btn.onclick = async ()=>{
        if(!confirm('Remove this foursome and its matchups?')) return;
        const [rid, qi] = btn.dataset.removeQuad.split(':');
        getRound(rid).quads.splice(Number(qi),1);
        await saveState(); render();
      };
    });
    document.querySelectorAll('[data-quad-slot]').forEach(sel=>{
      sel.onchange = async ()=>{
        const [rid, qi, slot] = sel.dataset.quadSlot.split(':');
        getRound(rid).quads[Number(qi)].players[Number(slot)] = sel.value;
        await saveState(); render();
      };
    });
    document.querySelectorAll('[data-quad-partner]').forEach(sel=>{
      sel.onchange = async ()=>{
        const [rid, qi, seg] = sel.dataset.quadPartner.split(':');
        getRound(rid).quads[Number(qi)].partnerOrder[Number(seg)] = Number(sel.value);
        await saveState(); render();
      };
    });
    document.querySelectorAll('[data-add-pair]').forEach(btn=>{
      btn.onclick = async ()=>{
        getRound(btn.dataset.addPair).pairs.push({ id: 'pair-' + Date.now(), players:['',''] });
        await saveState(); render();
      };
    });
    document.querySelectorAll('[data-remove-pair]').forEach(btn=>{
      btn.onclick = async ()=>{
        if(!confirm('Remove this pair?')) return;
        const [rid, pi] = btn.dataset.removePair.split(':');
        getRound(rid).pairs.splice(Number(pi),1);
        await saveState(); render();
      };
    });
    document.querySelectorAll('[data-pair-slot]').forEach(sel=>{
      sel.onchange = async ()=>{
        const [rid, pi, slot] = sel.dataset.pairSlot.split(':');
        getRound(rid).pairs[Number(pi)].players[Number(slot)] = sel.value;
        await saveState(); render();
      };
    });
    document.querySelectorAll('[data-autofill-quads]').forEach(btn=>{
      btn.onclick = async ()=>{
        const round = getRound(btn.dataset.autofillQuads);
        // Seed roster names (keep existing handicap if the name already exists)
        const existingByName = {};
        state.players.forEach(p=>{ existingByName[p.name] = p.handicap; });
        state.players = ROSTER_R1.map(name=>({ name, handicap: existingByName[name] !== undefined ? existingByName[name] : 0 }));
        round.quads = QUADS_R1.map(q=>({ players: q.players.slice(), partnerOrder: q.partnerOrder.slice() }));
        await saveState(); render();
      };
    });

    document.querySelectorAll('[data-autofill-card]').forEach(btn=>{
      btn.onclick = async ()=>{
        const round = getRound(btn.dataset.autofillCard);
        const card = KNOWN_SCORECARDS[round.course];
        if(!card) return;
        round.par = card.par.slice();
        round.hcpIndex = card.hcpIndex.slice();
        await saveState();
        render();
      };
    });

    const exportBtn = document.getElementById('exportBtn');
    if(exportBtn) exportBtn.onclick = ()=>{
      const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const dateStr = new Date().toISOString().slice(0,10);
      const safeName = (state.name||'tournament').toLowerCase().replace(/[^a-z0-9]+/g,'-');
      a.href = url;
      a.download = `${safeName}-backup-${dateStr}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    };

    const exportExcelBtn = document.getElementById('exportExcelBtn');
    if(exportExcelBtn) exportExcelBtn.onclick = ()=>{ exportToExcel(); };

    const importFile = document.getElementById('importFile');
    if(importFile) importFile.onchange = async (e)=>{
      const importStatus = document.getElementById('importStatus');
      const file = e.target.files[0];
      if(!file) return;
      try{
        const text = await file.text();
        const parsed = JSON.parse(text);
        if(!parsed.players || !parsed.rounds){
          importStatus.textContent = 'That file doesn\'t look like a valid backup.';
          return;
        }
        state = parsed;
        await saveState();
        importStatus.textContent = 'Backup restored.';
        render();
      }catch(err){
        importStatus.textContent = 'Could not read that file.';
      }
    };
  }
}

const saveTimers = {};

function flashStatus(statusKey, text, isError){
  const el = document.querySelector(`[data-status-key="${statusKey}"]`);
  if(!el) return;
  el.textContent = text;
  el.classList.toggle('error', !!isError);
  el.classList.add('show');
  clearTimeout(el._fadeTimer);
  el._fadeTimer = setTimeout(()=>{ el.classList.remove('show'); }, 1200);
}

function scheduleHoleSave(round, player, hole, rawValue, immediate){
  const statusKey = `${player}__${hole}`;
  const timerKey = `${round}__${player}__${hole}`;
  if(saveTimers[timerKey]) clearTimeout(saveTimers[timerKey]);
  const doSave = async ()=>{
    if(rawValue !== '' && isNaN(Number(rawValue))){
      flashStatus(statusKey, 'Invalid', true);
      return;
    }
    try{
      const latest = await backendGet();
      if(latest) state = normalizeState(latest);
      const k = scoreKey(round, player, hole);
      if(rawValue === ''){ delete state.scores[k]; }
      else { state.scores[k] = Number(rawValue); }
      await saveState();
      flashStatus(statusKey, rawValue==='' ? 'Cleared' : 'Saved');
    }catch(e){
      flashStatus(statusKey, 'Failed', true);
    }
  };
  if(immediate){ doSave(); }
  else { saveTimers[timerKey] = setTimeout(doSave, 600); }
}

function scheduleKpSave(round, player, hole, field, rawValue){
  const statusKey = `${player}__${hole}`;
  const timerKey = `kp__${round}__${player}__${hole}__${field}`;
  if(saveTimers[timerKey]) clearTimeout(saveTimers[timerKey]);
  saveTimers[timerKey] = setTimeout(async ()=>{
    if(rawValue !== '' && isNaN(Number(rawValue))){
      flashStatus(statusKey, 'Invalid', true);
      return;
    }
    try{
      const latest = await backendGet();
      if(latest) state = normalizeState(latest);
      const k = kpKey(round, player, hole);
      if(!state.kp[k]) state.kp[k] = { feet: null, inches: null };
      state.kp[k][field] = rawValue === '' ? null : Number(rawValue);
      await saveState();
      flashStatus(statusKey, 'Saved');
    }catch(e){
      flashStatus(statusKey, 'Failed', true);
    }
  }, 600);
}

async function saveLdCheck(round, player, hole, checked){
  const statusKey = `${player}__${hole}`;
  try{
    const latest = await backendGet();
    if(latest) state = normalizeState(latest);
    const k = ldKey(round, player, hole);
    const prevTs = state.ld[k] ? state.ld[k].ts : null;
    state.ld[k] = { checked, ts: checked ? Date.now() : prevTs };
    await saveState();
    flashStatus(statusKey, checked ? 'LD set' : 'Cleared');
  }catch(e){
    flashStatus(statusKey, 'Failed', true);
  }
}

function exportToExcel(){
  if(typeof XLSX === 'undefined'){
    alert('Excel export library failed to load — check your connection and try again.');
    return;
  }
  const wb = XLSX.utils.book_new();

  // Overall sheet
  const overallRows = [['Player','Gross Total','Gross To Par','Net Total','Net To Par']];
  state.players.forEach(p=>{
    let gTotal=0,gCount=0,gParSum=0,gMissing=false;
    let nTotal=0,nCount=0,nParSum=0,nMissing=false;
    state.rounds.forEach(r=>{
      const g = roundGrossTotal(r.id, p.name);
      gTotal+=g.total; gCount+=g.count; if(g.count>0){ if(g.toPar===null) gMissing=true; else gParSum+=g.toPar; }
      const n = roundNetTotal(r.id, p.name);
      nTotal+=n.total; nCount+=n.count; if(n.count>0){ if(n.toPar===null) nMissing=true; else nParSum+=n.toPar; }
    });
    overallRows.push([
      p.name,
      gCount>0?gTotal:'', gCount>0 && !gMissing ? gParSum : '',
      nCount>0?nTotal:'', nCount>0 && !nMissing ? nParSum : ''
    ]);
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(overallRows), 'Overall');

  // Per-round sheets: hole-by-hole gross scores, plus a summary
  state.rounds.forEach(round=>{
    const header = ['Player', ...Array.from({length:18},(_,i)=>`H${i+1}`), 'Gross', 'Gross ToPar', 'Net', 'Net ToPar'];
    const rows = [header];
    state.players.forEach(p=>{
      const holeVals = [];
      for(let h=1; h<=18; h++){
        const v = getScore(round.id, p.name, h);
        holeVals.push(v!==null ? v : '');
      }
      const g = roundGrossTotal(round.id, p.name);
      const n = roundNetTotal(round.id, p.name);
      rows.push([
        p.name, ...holeVals,
        g.count>0?g.total:'', g.toPar!==null?g.toPar:'',
        n.count>0?n.total:'', n.toPar!==null?n.toPar:''
      ]);
    });
    const parRow = ['Par', ...round.par.map(v=>v!==null&&v!==undefined?v:''), '', '', '', ''];
    const hcpRow = ['Stroke Index', ...round.hcpIndex.map(v=>v!==null&&v!==undefined?v:''), '', '', '', ''];
    rows.splice(1, 0, parRow, hcpRow);
    const sheetName = round.label.replace(/[\\\/\?\*\[\]:]/g,'').slice(0,31);
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), sheetName);

    if(round.format==='sixes'){
      const totals = sixesTotalsForRound(round.id);
      const sixesRows = [['Player','Individual Sixes Points']];
      state.players.forEach(p=> sixesRows.push([p.name, totals[p.name]||0]));
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(sixesRows), `${sheetName} Sixes`.slice(0,31));
    }
  });

  const dateStr = new Date().toISOString().slice(0,10);
  const safeName = (state.name||'tournament').toLowerCase().replace(/[^a-z0-9]+/g,'-');
  XLSX.writeFile(wb, `${safeName}-scores-${dateStr}.xlsx`);
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
}
function escapeAttr(str){ return escapeHtml(str); }

async function pollForUpdates(){
  if(currentTab==='setup' || currentTab==='enter') return;
  try{
    const latest = await backendGet();
    if(latest){
      const normalized = normalizeState(latest);
      if(JSON.stringify(normalized) !== JSON.stringify(state)){
        state = normalized;
        render();
      }
    }
  }catch(e){}
}

loadState();
pollTimer = setInterval(pollForUpdates, 4000);
