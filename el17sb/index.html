        }).join('')}
      </div>
    </details>
    <details data-details-key="${round.id}-teegroups" ${uiDetailsState[`${round.id}-teegroups`] ? 'open' : ''}>
      <summary>Tee Groups for ${escapeHtml(round.label)} (who can enter scores for whom)</summary>
      <div class="card">
        <p class="muted" style="margin-top:0;">Each phone picks one group here for this round. Groups reset per round, so today's foursomes don't carry over to a different day's mix.</p>
        ${round.format==='sixes' ? `<button class="btn secondary" data-copy-quads-to-teegroups="${round.id}">Copy from this Round's Foursomes</button>` : ''}
      </div>
      <div class="card">
        ${(round.teeGroups||[]).map((tg, ti)=>`
          <div class="group-box">
            <div class="group-label">${escapeHtml(tg.name || `Group ${ti+1}`)} <button class="remove-x" data-remove-teegroup="${round.id}:${ti}" style="float:right;">&times;</button></div>
            <input type="text" data-teegroup-name="${round.id}:${ti}" value="${escapeAttr(tg.name || '')}" placeholder="Group name (e.g. Group 1)" style="margin-bottom:8px;">
            ${[0,1,2,3].map(slot=>`
              <select data-teegroup-slot="${round.id}:${ti}:${slot}">
                <option value="">— select player —</option>
                ${sortedPlayers().map(p=>`<option value="${escapeAttr(p.name)}" ${tg.players[slot]===p.name?'selected':''}>${escapeHtml(p.name)}</option>`).join('')}
              </select>
            `).join('')}
          </div>`).join('')}
        <button class="btn secondary" data-add-teegroup="${round.id}">Add Group</button>
      </div>
    </details>
    <details data-details-key="${round.id}-scorecard" ${uiDetailsState[`${round.id}-scorecard`] ? 'open' : ''}>
      <summary>Scorecard — Par &amp; Stroke Index (18 holes)</summary>
      <div class="card">
        ${KNOWN_SCORECARDS[round.course] ? `<button class="btn secondary" data-autofill-card="${round.id}">Autofill ${escapeHtml(round.course)} Card</button>` : ''}
        <div class="scorecard-grid">
          <div class="hdr">Hole</div><div class="hdr">Par</div><div class="hdr">Stroke Index</div>
          ${Array.from({length:18},(_,h)=>`
            <div class="hole-num">${h+1}</div>
            <input type="number" class="hole-input" data-par="${round.id}:${h}" value="${round.par[h]!==null?round.par[h]:''}" placeholder="-">
            <input type="number" class="hole-input" data-hcpidx="${round.id}:${h}" value="${round.hcpIndex[h]!==null?round.hcpIndex[h]:''}" placeholder="-">
          `).join('')}
        </div>
        <p class="muted" style="margin-top:10px;">Stroke Index = the hole's difficulty rank (1 = hardest) from the scorecard, used to allocate handicap strokes.</p>
      </div>
    </details>`;

    if(round.format==='sixes'){
      const quadsKey = `${round.id}-quads`;
      if(!(quadsKey in uiDetailsState)) uiDetailsState[quadsKey] = true;
      html += `<details data-details-key="${quadsKey}" ${uiDetailsState[quadsKey] ? 'open' : ''}><summary>Foursomes for ${escapeHtml(round.label)} (rotating 1-on-1, net score, 2/1/0 per hole)</summary><div class="card">`;
      html += `<button class="btn secondary" data-autofill-quads="${round.id}" style="margin-bottom:12px;">Load Round 1 Roster &amp; Matchups</button>`;
      (round.quads||[]).forEach((quad, qi)=>{
        const filled = quad.players.filter(Boolean).length === 4;
        html += `<div class="group-box">
          <div class="group-label">Foursome ${qi+1} <button class="remove-x" data-remove-quad="${round.id}:${qi}" style="float:right;">&times;</button></div>
          ${[0,1,2,3].map(slot=>`
            <select data-quad-slot="${round.id}:${qi}:${slot}">
              <option value="">— select player —</option>
              ${sortedPlayers().map(p=>`<option value="${escapeAttr(p.name)}" ${quad.players[slot]===p.name?'selected':''}>${escapeHtml(p.name)}</option>`).join('')}
            </select>
          `).join('')}
          <label style="margin-top:8px;">Matchup schedule</label>
          ${[0,1,2].map(seg=>{
            const pairs = filled ? quadPairsForSegment(quad, seg) : null;
            const holeRange = `${seg*6+1}-${seg*6+6}`;
            return `<div class="muted" style="margin-bottom:6px;">
              Holes ${holeRange}: ${pairs ? `${escapeHtml(pairs[0][0])} vs ${escapeHtml(pairs[0][1])} &nbsp;|&nbsp; ${escapeHtml(pairs[1][0])} vs ${escapeHtml(pairs[1][1])}` : 'select all 4 players above'}
              <select data-quad-partner="${round.id}:${qi}:${seg}" style="margin-top:4px;">
                <option value="1" ${quad.partnerOrder[seg]===1?'selected':''}>Slot 1 pairs with Slot 2</option>
                <option value="2" ${quad.partnerOrder[seg]===2?'selected':''}>Slot 1 pairs with Slot 3</option>
                <option value="3" ${quad.partnerOrder[seg]===3?'selected':''}>Slot 1 pairs with Slot 4</option>
              </select>
            </div>`;
          }).join('')}
        </div>`;
      });
      html += `<button class="btn secondary" data-add-quad="${round.id}">Add Foursome</button></div></details>`;
    }

    if(round.format==='pairs'){
      const pairsKey = `${round.id}-pairs`;
      if(!(pairsKey in uiDetailsState)) uiDetailsState[pairsKey] = true;
      html += `<details data-details-key="${pairsKey}" ${uiDetailsState[pairsKey] ? 'open' : ''}><summary>Pairs for ${escapeHtml(round.label)} (team best-ball gross + net)</summary><div class="card">`;
      (round.pairs||[]).forEach((pair, pi)=>{
        html += `<div class="group-box">
          <div class="group-label">Pair ${pi+1} <button class="remove-x" data-remove-pair="${round.id}:${pi}" style="float:right;">&times;</button></div>
          ${[0,1].map(slot=>`
            <select data-pair-slot="${round.id}:${pi}:${slot}">
              <option value="">— select player —</option>
              ${sortedPlayers().map(p=>`<option value="${escapeAttr(p.name)}" ${pair.players[slot]===p.name?'selected':''}>${escapeHtml(p.name)}</option>`).join('')}
            </select>
          `).join('')}
        </div>`;
      });
      html += `<button class="btn secondary" data-add-pair="${round.id}">Add Pair</button></div></details>`;
    }
  });

  html += `<h2 class="section-title">Backup</h2>
  <div class="card">
    <button class="btn secondary" id="exportBtn">Download Backup (.json)</button>
    <p class="muted" style="margin:10px 0;">Saves everything — players, handicaps, scorecards, groups, and scores — as a file you can keep or restore later.</p>
    <label>Restore from Backup</label>
    <input type="file" id="importFile" accept="application/json">
    <div class="status-msg" id="importStatus"></div>
  </div>
  <div class="card">
    <button class="btn secondary" id="exportExcelBtn">Export to Excel (.xlsx)</button>
    <p class="muted" style="margin-top:10px;">Downloads a spreadsheet with Overall standings, each round's gross/net and hole-by-hole scores, and Round 1's Individual Sixes points. Open it directly in Excel, or import it into Google Sheets (File → Import → Upload).</p>
  </div>`;

  if(BACKEND.mode === 'firebase'){
    html += `<div class="card">
    <button class="btn secondary" id="lockSetupBtn">Sign out of Setup</button>
    <p class="muted" style="margin-top:10px;">Setup unlocks with the organizer password and locks again automatically when you close this browser tab.</p>
  </div>`;
  }

  html += `<div class="muted" style="text-align:center; margin-top:16px;">Everyone using this link shares the same live data.</div>`;
  return html;
}

function attachHandlers(){
  document.querySelectorAll('nav.tabs button').forEach(b=>{
    b.onclick = async ()=>{
      const tab = b.dataset.tab;
      if(BACKEND.mode === 'firebase'){
        try{
          if(tab === 'setup') await ensureAdminSession();        // organizer password
          else if(tab === 'enter') await ensureScoringSession();  // scorer password
        }catch(e){ return; } // cancelled or failed sign-in: stay on the current tab
      }
      currentTab = tab;
      render();
    };
  });

  document.querySelectorAll('[data-details-key]').forEach(el=>{
    el.ontoggle = ()=>{ uiDetailsState[el.dataset.detailsKey] = el.open; };
  });

  if(currentTab==='leaderboard'){
    document.querySelectorAll('[data-lb]').forEach(b=>{
      b.onclick = ()=>{ lbView=b.dataset.lb; render(); };
    });
  }

  if(currentTab==='enter'){
    const pickerRoundSelect = document.getElementById('pickerRoundSelect');
    if(pickerRoundSelect) pickerRoundSelect.onchange = e=>{ entrySel.round = e.target.value; render(); };

    document.querySelectorAll('[data-pick-teegroup]').forEach(btn=>{
      btn.onclick = ()=>{
        localStorage.setItem(`myTeeGroupId_${entrySel.round}`, btn.dataset.pickTeegroup);
        entrySel.player = '';
        render();
      };
    });
    const switchGroupBtn = document.getElementById('switchGroupBtn');
    if(switchGroupBtn) switchGroupBtn.onclick = ()=>{
      if(!confirm('Switch to a different foursome for this round on this phone?')) return;
      localStorage.removeItem(`myTeeGroupId_${entrySel.round}`);
      render();
    };

    document.querySelectorAll('[data-entry-mode]').forEach(btn=>{
      btn.onclick = ()=>{ entryMode = btn.dataset.entryMode; render(); };
    });

    const roundSelect = document.getElementById('roundSelect');
    const playerSelect = document.getElementById('playerSelect');
    if(roundSelect) roundSelect.onchange = e=>{ entrySel.round=e.target.value; render(); };
    if(playerSelect) playerSelect.onchange = e=>{ entrySel.player=e.target.value; render(); };

    const prevHoleBtn = document.getElementById('prevHoleBtn');
    const nextHoleBtn = document.getElementById('nextHoleBtn');
    if(prevHoleBtn) prevHoleBtn.onclick = ()=>{ if(entrySel.hole>1){ entrySel.hole--; render(); } };
    if(nextHoleBtn) nextHoleBtn.onclick = ()=>{ if(entrySel.hole<18){ entrySel.hole++; render(); } };

    // By-player mode: one player fixed, looping over all 18 holes
    document.querySelectorAll('[data-live-hole]').forEach(input=>{
      input.oninput = ()=>{
        const hole = Number(input.dataset.liveHole);
        const clearBtn = document.querySelector(`[data-clear-hole="${hole}"]`);
        if(clearBtn) clearBtn.style.visibility = input.value==='' ? 'hidden' : 'visible';
        scheduleHoleSave(entrySel.round, entrySel.player, hole, input.value);
      };
    });
    document.querySelectorAll('[data-clear-hole]').forEach(btn=>{
      btn.onclick = ()=>{
        const hole = Number(btn.dataset.clearHole);
        const input = document.querySelector(`[data-live-hole="${hole}"]`);
        if(input) input.value = '';
        btn.style.visibility = 'hidden';
        scheduleHoleSave(entrySel.round, entrySel.player, hole, '', true);
      };
    });
    document.querySelectorAll('[data-kp-feet]').forEach(inp=>{
      inp.oninput = ()=> scheduleKpSave(entrySel.round, entrySel.player, Number(inp.dataset.kpFeet), 'feet', inp.value);
    });
    document.querySelectorAll('[data-kp-inches]').forEach(inp=>{
      inp.oninput = ()=> scheduleKpSave(entrySel.round, entrySel.player, Number(inp.dataset.kpInches), 'inches', inp.value);
    });
    document.querySelectorAll('[data-ld-check]').forEach(cb=>{
      cb.onchange = ()=> saveLdCheck(entrySel.round, entrySel.player, Number(cb.dataset.ldCheck), cb.checked);
    });

    // By-hole mode: one hole fixed, looping over all players in the group
    document.querySelectorAll('[data-live-player]').forEach(input=>{
      input.oninput = ()=>{
        const player = input.dataset.livePlayer;
        const clearBtn = document.querySelector(`[data-clear-player="${CSS.escape(player)}"]`);
        if(clearBtn) clearBtn.style.visibility = input.value==='' ? 'hidden' : 'visible';
        scheduleHoleSave(entrySel.round, player, entrySel.hole, input.value);
      };
    });
    document.querySelectorAll('[data-clear-player]').forEach(btn=>{
      btn.onclick = ()=>{
        const player = btn.dataset.clearPlayer;
        const input = document.querySelector(`[data-live-player="${CSS.escape(player)}"]`);
        if(input) input.value = '';
        btn.style.visibility = 'hidden';
        scheduleHoleSave(entrySel.round, player, entrySel.hole, '', true);
      };
    });
    document.querySelectorAll('[data-kp-feet-player]').forEach(inp=>{
      inp.oninput = ()=> scheduleKpSave(entrySel.round, inp.dataset.kpFeetPlayer, entrySel.hole, 'feet', inp.value);
    });
    document.querySelectorAll('[data-kp-inches-player]').forEach(inp=>{
      inp.oninput = ()=> scheduleKpSave(entrySel.round, inp.dataset.kpInchesPlayer, entrySel.hole, 'inches', inp.value);
    });
    document.querySelectorAll('[data-ld-check-player]').forEach(cb=>{
      cb.onchange = ()=> saveLdCheck(entrySel.round, cb.dataset.ldCheckPlayer, entrySel.hole, cb.checked);
    });
  }

  if(currentTab==='setup'){
    const saveNameBtn = document.getElementById('saveName');
    if(saveNameBtn) saveNameBtn.onclick = async ()=>{
      state.name = document.getElementById('nameInput').value || 'Tournament';
      await saveState(); render();
    };
    const saveTournamentImageBtn = document.getElementById('saveTournamentImage');
    if(saveTournamentImageBtn) saveTournamentImageBtn.onclick = async ()=>{
      state.tournamentImageUrl = document.getElementById('tournamentImageInput').value.trim();
      await saveState(); render();
    };
    const globalUseCourseHandicapCb = document.getElementById('globalUseCourseHandicap');
    if(globalUseCourseHandicapCb) globalUseCourseHandicapCb.onchange = async ()=>{
      state.useCourseHandicap = globalUseCourseHandicapCb.checked;
      await saveState(); render();
    };
    const addPlayerBtn = document.getElementById('addPlayer');
    if(addPlayerBtn) addPlayerBtn.onclick = async ()=>{
      const name = document.getElementById('newPlayerInput').value.trim();
      const hcp = Number(document.getElementById('newPlayerHcp').value) || 0;
      if(!name) return;
      state.players.push({name, handicap: hcp});
      await saveState(); render();
    };

    document.querySelectorAll('[data-copy-quads-to-teegroups]').forEach(btn=>{
      btn.onclick = async ()=>{
        const round = getRound(btn.dataset.copyQuadsToTeegroups);
        const validQuads = (round.quads||[]).filter(q=>q.players.filter(Boolean).length===4);
        if(!validQuads.length){
          alert('This round\'s foursomes aren\'t set up yet — use "Load Round 1 Roster & Matchups" first, or build Tee Groups manually below.');
          return;
        }
        round.teeGroups = validQuads.map((q,i)=>({
          id: 'teegroup-' + Date.now() + '-' + i,
          name: `Group ${i+1}`,
          players: q.players.slice()
        }));
        await saveState(); render();
      };
    });
    document.querySelectorAll('[data-add-teegroup]').forEach(btn=>{
      btn.onclick = async ()=>{
        const round = getRound(btn.dataset.addTeegroup);
        round.teeGroups.push({ id: 'teegroup-' + Date.now(), name: `Group ${round.teeGroups.length+1}`, players:['','','',''] });
        await saveState(); render();
      };
    });
    document.querySelectorAll('[data-remove-teegroup]').forEach(btn=>{
      btn.onclick = async ()=>{
        if(!confirm('Remove this tee group?')) return;
        const [rid, ti] = btn.dataset.removeTeegroup.split(':');
        getRound(rid).teeGroups.splice(Number(ti),1);
        await saveState(); render();
      };
    });
    document.querySelectorAll('[data-teegroup-name]').forEach(inp=>{
      inp.onchange = async ()=>{
        const [rid, ti] = inp.dataset.teegroupName.split(':');
        getRound(rid).teeGroups[Number(ti)].name = inp.value;
        await saveState(); render();
      };
    });
    document.querySelectorAll('[data-teegroup-slot]').forEach(sel=>{
      sel.onchange = async ()=>{
        const [rid, ti, slot] = sel.dataset.teegroupSlot.split(':');
        getRound(rid).teeGroups[Number(ti)].players[Number(slot)] = sel.value;
        await saveState(); render();
      };
    });
    document.querySelectorAll('[data-remove-player]').forEach(btn=>{
      btn.onclick = async ()=>{
        const idx = Number(btn.dataset.removePlayer);
        const name = state.players[idx] ? state.players[idx].name : 'this player';
        if(!confirm(`Remove ${name}? This can't be undone and will affect any groups/foursomes they're in.`)) return;
        state.players.splice(idx,1);
        await saveState(); render();
      };
    });
    document.querySelectorAll('[data-hcp-index]').forEach(inp=>{
      inp.onchange = async ()=>{
        state.players[Number(inp.dataset.hcpIndex)].handicap = Number(inp.value)||0;
        await saveState();
      };

const saveTimers = {};

function flashStatus(statusKey, text, isError){
  const el = document.querySelector(`[data-status-key="${statusKey}"]`);
  if(!el) return;
  el.textContent = text;
  el.classList.toggle('error', !!isError);
  el.classList.add('show');
  clearTimeout(el._fadeTimer);
  el._fadeTimer = setTimeout(()=>{ el.classList.remove('show'); }, 1200);
}

// Saves one small scoring change (a score, a closest-to-pin distance or a
// longest-drive flag). In Firebase mode this writes ONLY that one database
// path, so it can never overwrite anyone else's entries and only needs the
// scorer sign-in. Other backend modes still save the whole state.
async function persistScoring(write){
  if(BACKEND.mode !== 'firebase'){ await saveState(); return; }
  try{
    await withSession(ensureScoringSession, db => db.ref('tournament/' + write.path).set(write.value));
  }catch(e){
    console.error('score save failed', e);
    if(e && e.message === 'Scorer sign-in required.'){
      alert('Not saved — the scorer password is needed to record scores.');
    }
    // Nothing reached the database, so pull the real server state back down
    // and re-render — otherwise the failed entry keeps showing locally.
    try{
      const serverState = await backendGet();
      state = normalizeState(serverState);
      render();
    }catch(e2){ /* self-corrects on the next successful sync */ }
    throw e;
  }
}

// Shared debounce-then-merge-then-save helper used by scheduleHoleSave and
// scheduleKpSave: both need to wait for the user to stop typing, re-fetch the
// latest state (so the screen reflects other devices' entries), apply one
// small mutation locally, then persist just that change. applyMutation returns
// { savedLabel, write:{ path, value } } — `path` is relative to /tournament and
// a null `value` deletes the entry.
function debounceMergeSave(timerKey, delayMs, statusKey, applyMutation){
  if(saveTimers[timerKey]) clearTimeout(saveTimers[timerKey]);
  const doSave = async ()=>{
    try{
      const latest = await backendGet();
      if(latest) state = normalizeState(latest);
      const { savedLabel, write } = applyMutation();
      await persistScoring(write);
      flashStatus(statusKey, savedLabel);
    }catch(e){
      // persistScoring() already reverted `state` to the real server value and
      // re-rendered — this just updates the small per-field status label.
      flashStatus(statusKey, 'Failed', true);
    }
  };
  if(delayMs === 0){ doSave(); }
  else { saveTimers[timerKey] = setTimeout(doSave, delayMs); }
}

function scheduleHoleSave(round, player, hole, rawValue, immediate){
  const statusKey = `${player}__${hole}`;
  const timerKey = `${round}__${player}__${hole}`;
  if(rawValue !== '' && isNaN(Number(rawValue))){
    if(saveTimers[timerKey]) clearTimeout(saveTimers[timerKey]);
    flashStatus(statusKey, 'Invalid', true);
    return;
  }
  debounceMergeSave(timerKey, immediate ? 0 : 600, statusKey, ()=>{
    const k = scoreKey(round, player, hole);
    if(rawValue === ''){ delete state.scores[k]; }
    else { state.scores[k] = Number(rawValue); }
    return {
      savedLabel: rawValue === '' ? 'Cleared' : 'Saved',
      write: { path: `scores/${k}`, value: rawValue === '' ? null : Number(rawValue) }
    };
  });
}

function scheduleKpSave(round, player, hole, field, rawValue){
  const statusKey = `${player}__${hole}`;
  const timerKey = `kp__${round}__${player}__${hole}__${field}`;
  if(rawValue !== '' && isNaN(Number(rawValue))){
    if(saveTimers[timerKey]) clearTimeout(saveTimers[timerKey]);
    flashStatus(statusKey, 'Invalid', true);
    return;
  }
  debounceMergeSave(timerKey, 600, statusKey, ()=>{
    const k = kpKey(round, player, hole);
    if(!state.kp[k]) state.kp[k] = { feet: null, inches: null };
    const value = rawValue === '' ? null : Number(rawValue);
    state.kp[k][field] = value;
    return { savedLabel: 'Saved', write: { path: `kp/${k}/${field}`, value } };
  });
}

async function saveLdCheck(round, player, hole, checked){
  const statusKey = `${player}__${hole}`;
  try{
    const latest = await backendGet();
    if(latest) state = normalizeState(latest);
    const k = ldKey(round, player, hole);
    const prevTs = (state.ld[k] && state.ld[k].ts !== undefined && state.ld[k].ts !== null) ? state.ld[k].ts : null;
    state.ld[k] = { checked, ts: checked ? Date.now() : prevTs };
    await persistScoring({ path: `ld/${k}`, value: { checked, ts: state.ld[k].ts } });
    flashStatus(statusKey, checked ? 'LD set' : 'Cleared');
  }catch(e){
    flashStatus(statusKey, 'Failed', true);
  }
}

function exportToExcel(){
  if(typeof XLSX === 'undefined'){
    alert('Excel export library failed to load — check your connection and try again.');
    return;
  }
  const wb = XLSX.utils.book_new();

  // Overall sheet
  const overallRows = [['Player','Gross Total','Gross To Par','Net Total','Net To Par']];
  state.players.forEach(p=>{
    let gTotal=0,gCount=0,gParSum=0,gMissing=false;
    let nTotal=0,nCount=0,nParSum=0,nMissing=false;
    state.rounds.forEach(r=>{
      const g = roundGrossTotal(r.id, p.name);
      gTotal+=g.total; gCount+=g.count; if(g.count>0){ if(g.toPar===null) gMissing=true; else gParSum+=g.toPar; }
      const n = roundNetTotal(r.id, p.name);
      nTotal+=n.total; nCount+=n.count; if(n.count>0){ if(n.toPar===null) nMissing=true; else nParSum+=n.toPar; }
    });
    overallRows.push([
      p.name,
      gCount>0?gTotal:'', gCount>0 && !gMissing ? gParSum : '',
      nCount>0?nTotal:'', nCount>0 && !nMissing ? nParSum : ''
    ]);
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(overallRows), 'Overall');

  // Per-round sheets: hole-by-hole gross scores, plus a summary
  state.rounds.forEach(round=>{
    const header = ['Player', ...Array.from({length:18},(_,i)=>`H${i+1}`), 'Gross', 'Gross ToPar', 'Net', 'Net ToPar'];
    const rows = [header];
    state.players.forEach(p=>{
      const holeVals = [];
      for(let h=1; h<=18; h++){
        const v = getScore(round.id, p.name, h);
        holeVals.push(v!==null ? v : '');
      }
      const g = roundGrossTotal(round.id, p.name);
      const n = roundNetTotal(round.id, p.name);
      rows.push([
        p.name, ...holeVals,
        g.count>0?g.total:'', g.toPar!==null?g.toPar:'',
        n.count>0?n.total:'', n.toPar!==null?n.toPar:''
      ]);
    });
    const parRow = ['Par', ...round.par.map(v=>v!==null&&v!==undefined?v:''), '', '', '', ''];
    const hcpRow = ['Stroke Index', ...round.hcpIndex.map(v=>v!==null&&v!==undefined?v:''), '', '', '', ''];
    rows.splice(1, 0, parRow, hcpRow);
    const sheetName = round.label.replace(/[\\\/\?\*\[\]:]/g,'').slice(0,31);
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), sheetName);

    if(round.format==='sixes'){
      const totals = sixesTotalsForRound(round.id);
      const sixesRows = [['Player','Individual Sixes Points']];
      state.players.forEach(p=> sixesRows.push([p.name, totals[p.name]||0]));
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(sixesRows), `${sheetName} Sixes`.slice(0,31));
    }
  });

  const dateStr = new Date().toISOString().slice(0,10);
  const safeName = (state.name||'tournament').toLowerCase().replace(/[^a-z0-9]+/g,'-');
  XLSX.writeFile(wb, `${safeName}-scores-${dateStr}.xlsx`);
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
}
// escapeAttr is currently identical to escapeHtml (both contexts need the same
// characters escaped); kept as a separate name so call sites document intent.
const escapeAttr = escapeHtml;

async function pollForUpdates(){
  if(currentTab==='setup' || currentTab==='enter') return;
  try{
    const latest = await backendGet();
    if(latest){
      const normalized = normalizeState(latest);
      if(JSON.stringify(normalized) !== JSON.stringify(state)){
        state = normalized;
        render();
      }
    }
  }catch(e){}
}

// ============================================================
// CHAT TAB — live chat on Firebase Realtime Database at /chat.
// No login: people just pick a handle (remembered on their device).
// Requires the /chat Database Rules (see chat-rules.json), otherwise
// messages are rejected and the tab shows a friendly error.
// ============================================================
const CHAT_MAX_NAME    = 20;
const CHAT_MAX_TEXT    = 300;
const CHAT_KEEP        = 100;                    // newest messages loaded / shown
const CHAT_TTL_MS      = 3 * 24 * 60 * 60 * 1000; // auto-delete age — must match the rule (259200000)
const CHAT_COOLDOWN_MS = 1000;                   // minimum gap between sends from one device
const CHAT_COLORS      = ['#7FC4A0','#E58F73','#8DB6E8','#C99AE0','#D9C46A','#E88FB4'];

function chatLsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function chatLsSet(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }

const CHAT_CID = (()=>{                          // anonymous per-device id, used only to style "my" messages
  let id = chatLsGet('chatCid');
  if(!id){
    id = 'c' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
    chatLsSet('chatCid', id);
  }
  return id;
})();

const chatMsgs = new Map();                      // key -> {key,name,text,ts,cid}
let chatLoaded = false;
let chatErr = '';
let chatSeen = (()=>{ const s = chatLsGet('chatLastSeen'); return s === null ? null : Number(s); })();
let chatDraft = '';
let chatEditing = false;                         // true while changing handle
let chatModerator = false;
let chatLastSent = 0;

function chatSanitize(key, v){
  if(!v || typeof v.text !== 'string' || typeof v.name !== 'string') return null;
  return {
    key,
    name: v.name.slice(0, CHAT_MAX_NAME),
    text: v.text.slice(0, CHAT_MAX_TEXT),
    ts: Number(v.ts) || 0,
    cid: typeof v.cid === 'string' ? v.cid : ''
  };
}

function chatColor(name){
  let h = 0;
  const s = String(name).toLowerCase();
  for(let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return CHAT_COLORS[h % CHAT_COLORS.length];
}

function chatFmtTime(ts){
  if(!ts) return '';
  const d = new Date(ts), now = new Date();
  const t = d.toLocaleTimeString([], { hour:'numeric', minute:'2-digit' });
  if(d.toDateString() === now.toDateString()) return t;
  return d.toLocaleDateString([], { month:'short', day:'numeric' }) + ' ' + t;
}

function chatLatestTs(){
  let t = 0;
  for(const m of chatMsgs.values()) if(m.ts > t) t = m.ts;
  return t;
}

function chatNearBottom(list){
  return list.scrollHeight - list.scrollTop - list.clientHeight < 80;
}

// ---------- unread badge ----------
function chatUpdateBadge(){
  const badge = document.getElementById('chatBadge');
  if(!badge) return;
  let n = 0;
  if(chatSeen !== null){
    for(const m of chatMsgs.values()) if(m.cid !== CHAT_CID && m.ts > chatSeen) n++;
  }
  if(currentTab === 'chat' && document.visibilityState === 'visible') n = 0;
  badge.textContent = n > 99 ? '99+' : String(n);
  badge.hidden = n === 0;
  const btn = document.querySelector('nav.tabs button[data-tab="chat"]');
  if(btn) btn.classList.toggle('chat-unread', n > 0);
}

function chatMarkSeen(){
  const t = chatLatestTs();
  if(t && (chatSeen === null || t > chatSeen)){
    chatSeen = t;
    chatLsSet('chatLastSeen', String(t));
  }
  chatUpdateBadge();
}

// ---------- status line ----------
function chatSetStatus(msg, transient){
  if(!transient) chatErr = msg || '';
  const el = document.getElementById('chatStatus');
  if(!el) return;
  el.textContent = msg || '';
  el.hidden = !msg;
  if(transient && msg){
    setTimeout(()=>{ if(el.textContent === msg){ el.textContent = chatErr; el.hidden = !chatErr; } }, 5000);
  }
}

// ---------- message list ----------
function chatEmptyState(list){
  const e = document.createElement('div');
  e.className = 'chat-empty';
  e.textContent = chatErr ? '' : (chatLoaded ? 'No messages yet. Say something!' : 'Loading chat…');
  list.appendChild(e);
}

function chatAppend(list, m){
  const empty = list.querySelector('.chat-empty');
  if(empty) empty.remove();
  const mine = m.cid === CHAT_CID;

  const row = document.createElement('div');
  row.className = 'chat-row' + (mine ? ' mine' : '');
  row.setAttribute('data-chat-key', m.key);

  const bubble = document.createElement('div');
  bubble.className = 'chat-bubble';

  const meta = document.createElement('div');
  meta.className = 'chat-meta';
  const nm = document.createElement('span');
  nm.className = 'chat-name';
  nm.textContent = m.name;                       // textContent: never interpreted as HTML
  if(!mine) nm.style.color = chatColor(m.name);
  const tm = document.createElement('span');
  tm.className = 'chat-time';
  tm.textContent = chatFmtTime(m.ts);
  meta.appendChild(nm);
  meta.appendChild(tm);
  if(chatModerator){
    const x = document.createElement('button');
    x.className = 'chat-del';
    x.textContent = '×';
    x.title = 'Delete message';
    x.setAttribute('aria-label', 'Delete message');
    x.setAttribute('data-chat-del', m.key);
    meta.appendChild(x);
  }

  const body = document.createElement('div');
  body.className = 'chat-text';
  body.textContent = m.text;

  bubble.appendChild(meta);
  bubble.appendChild(body);
  row.appendChild(bubble);
  list.appendChild(row);
}

function chatRenderAll(){
  const list = document.getElementById('chatList');
  if(!list) return;
  list.innerHTML = '';
  if(!chatMsgs.size) chatEmptyState(list);
  else for(const m of chatMsgs.values()) chatAppend(list, m);
  list.scrollTop = list.scrollHeight;
  chatShowNewPill(false);
}

function chatShowNewPill(show){
  const p = document.getElementById('chatNewPill');
  if(p) p.hidden = !show;
}

// a message arrived after the initial history load
function chatOnLive(m){
  if(currentTab === 'chat'){
    const list = document.getElementById('chatList');
    if(list){
      const stick = chatNearBottom(list) || m.cid === CHAT_CID;
      chatAppend(list, m);
      if(stick){ list.scrollTop = list.scrollHeight; chatShowNewPill(false); }
      else chatShowNewPill(true);
    }
    if(document.visibilityState === 'visible') chatMarkSeen();
  }
  chatUpdateBadge();
}

// ---------- composer (handle picker + message box) ----------
function chatGetHandle(){ return chatLsGet('chatHandle') || ''; }

function chatRenderComposer(){
  const box = document.getElementById('chatComposer');
  if(!box) return;
  const handle = chatGetHandle();

  if(!handle || chatEditing){
    box.innerHTML =
      '<div class="card chat-join">' +
        '<label for="chatHandleInput">PICK A HANDLE</label>' +
        '<div class="chat-inputrow">' +
          '<input type="text" id="chatHandleInput" maxlength="' + CHAT_MAX_NAME + '" placeholder="Your name or nickname" autocomplete="nickname" autocapitalize="words" enterkeyhint="go">' +
          '<button class="btn" id="chatJoinBtn" type="button">' + (handle ? 'Save' : 'Join') + '</button>' +
        '</div>' +
      '</div>';
    const hi = document.getElementById('chatHandleInput');
    hi.value = handle;
    const save = ()=>{
      const v = hi.value.replace(/\s+/g, ' ').trim().slice(0, CHAT_MAX_NAME);
      if(!v){ hi.focus(); return; }
      chatLsSet('chatHandle', v);
      chatEditing = false;
      chatRenderComposer();
      const mi = document.getElementById('chatInput');
      if(mi) mi.focus();
    };
    document.getElementById('chatJoinBtn').onclick = save;
    hi.onkeydown = e=>{ if(e.key === 'Enter'){ e.preventDefault(); save(); } };
    return;
  }

  box.innerHTML =
    '<div class="chat-as">Posting as <b id="chatAsName"></b> · <button class="chat-link" id="chatChangeBtn" type="button">change</button></div>' +
    '<div class="chat-inputrow">' +
      '<input type="text" id="chatInput" maxlength="' + CHAT_MAX_TEXT + '" placeholder="Message…" autocomplete="off" enterkeyhint="send">' +
      '<button class="btn" id="chatSendBtn" type="button">Send</button>' +
    '</div>';
  document.getElementById('chatAsName').textContent = handle;
  const input = document.getElementById('chatInput');
  input.value = chatDraft;
  input.oninput = ()=>{ chatDraft = input.value; };
  input.onkeydown = e=>{ if(e.key === 'Enter'){ e.preventDefault(); chatSend(); } };
  const sendBtn = document.getElementById('chatSendBtn');
  sendBtn.onmousedown = e=>e.preventDefault();   // keep the keyboard open on phones
  sendBtn.onclick = chatSend;
  document.getElementById('chatChangeBtn').onclick = ()=>{ chatEditing = true; chatRenderComposer(); const h = document.getElementById('chatHandleInput'); if(h){ h.focus(); h.select(); } };
}

async function chatSend(){
  const input = document.getElementById('chatInput');
  const name = chatGetHandle();
  if(!input || !name || !fbDb) return;
  const text = input.value.replace(/\s+/g, ' ').trim().slice(0, CHAT_MAX_TEXT);
  if(!text) return;
  const now = Date.now();
  if(now - chatLastSent < CHAT_COOLDOWN_MS) return;
  chatLastSent = now;
  input.value = '';
  chatDraft = '';
  input.focus();
  try{
    await fbDb.ref('chat').push({
      name, text, cid: CHAT_CID,
      ts: firebase.database.ServerValue.TIMESTAMP   // server clock, so everyone's timestamps agree
    });
  }catch(err){
    console.error('chat send failed', err);
    const cur = document.getElementById('chatInput');
    if(cur && !cur.value){ cur.value = text; chatDraft = text; }
    chatSetStatus(err && err.code === 'PERMISSION_DENIED'
      ? 'Message rejected — chat rules may not be installed yet.'
      : 'Could not send. Check your connection.', true);
  }
}

// ---------- moderator (organizer password) ----------
function chatRenderFoot(){
  const foot = document.getElementById('chatFoot');
  if(!foot) return;
  const days = Math.round(CHAT_TTL_MS / 86400000);
  if(!chatModerator){
    foot.innerHTML = 'Messages auto-delete after ' + days + ' days. · <button class="chat-link" id="chatModBtn" type="button">Moderator</button>';
    document.getElementById('chatModBtn').onclick = async ()=>{
      try{ await ensureAdminSession(); }catch(e){ return; }
      chatModerator = true;
      chatRenderAll();
      chatRenderFoot();
    };
  }else{
    foot.innerHTML = '<b>Moderator mode</b> — tap × to delete a message. · ' +
      '<button class="chat-link" id="chatClearBtn" type="button">Clear all</button> · ' +
      '<button class="chat-link" id="chatModOff" type="button">Done</button>';
    document.getElementById('chatModOff').onclick = ()=>{ chatModerator = false; chatRenderAll(); chatRenderFoot(); };
    document.getElementById('chatClearBtn').onclick = async ()=>{
      if(!confirm('Delete ALL chat messages for everyone?')) return;
      try{ await withSession(ensureAdminSession, db=>db.ref('chat').remove()); }
      catch(e){ chatSetStatus('Could not clear chat. Check organizer sign-in and rules.', true); }
    };
  }
}

async function chatDelete(key){
  try{ await withSession(ensureAdminSession, db=>db.ref('chat/' + key).remove()); }
  catch(e){ chatSetStatus('Could not delete. Check organizer sign-in and rules.', true); }
}

// ---------- mounting the tab ----------
function mountChat(main){
  if(BACKEND.mode !== 'firebase' || !fbDb){
    main.innerHTML = '<div class="card"><div class="muted">Chat needs the Firebase backend.</div></div>';
    return;
  }
  main.innerHTML =
    '<div id="chatRoot">' +
      '<h2 class="section-title">Chat</h2>' +
      '<div class="chat-status" id="chatStatus" hidden></div>' +
      '<div class="chat-wrap">' +
        '<div class="chat-list" id="chatList" aria-live="polite"></div>' +
        '<button class="chat-newpill" id="chatNewPill" type="button" hidden>New messages ↓</button>' +
      '</div>' +
      '<div id="chatComposer"></div>' +
      '<div class="chat-foot" id="chatFoot"></div>' +
    '</div>';

  const list = document.getElementById('chatList');
  list.addEventListener('scroll', ()=>{ if(chatNearBottom(list)) chatShowNewPill(false); });
  list.addEventListener('click', e=>{
    const b = e.target.closest('[data-chat-del]');
    if(b) chatDelete(b.getAttribute('data-chat-del'));
  });
  document.getElementById('chatNewPill').onclick = ()=>{ list.scrollTop = list.scrollHeight; chatShowNewPill(false); };

  chatSetStatus(chatErr);
  chatRenderAll();
  chatRenderComposer();
  chatRenderFoot();
  chatMarkSeen();
}

// ---------- live connection ----------
// Removes messages older than CHAT_TTL_MS. Any device may do this: the Database
// Rules only allow the public to delete messages that are already that old.
async function chatCleanupOld(){
  try{
    for(let pass = 0; pass < 4; pass++){
      const snap = await fbDb.ref('chat').orderByKey().limitToFirst(50).once('value');
      const cutoff = Date.now() - CHAT_TTL_MS;
      const updates = {};
      let stale = 0, seen = 0;
      snap.forEach(c=>{
        seen++;
        const v = c.val();
        if(v && Number(v.ts) < cutoff){ updates[c.key] = null; stale++; }
      });
      if(stale) await fbDb.ref('chat').update(updates);
      if(stale < 50 || seen < 50) break;
    }
  }catch(e){ /* housekeeping only — never blocks chat */ }
}

function initChat(){
  if(BACKEND.mode !== 'firebase' || !fbDb) return;
  const q = fbDb.ref('chat').orderByKey().limitToLast(CHAT_KEEP);
  const fail = err=>{
    console.error('chat listener error', err);
    chatSetStatus('Chat is not set up yet (database rules for /chat are missing).');
    const list = document.getElementById('chatList');
    if(list && !chatMsgs.size){ list.innerHTML = ''; }
  };

  q.on('child_added', snap=>{
    const m = chatSanitize(snap.key, snap.val());
    if(!m) return;
    chatMsgs.set(m.key, m);
    if(chatLoaded) chatOnLive(m);
  }, fail);

  q.on('child_removed', snap=>{
    chatMsgs.delete(snap.key);
    const list = document.getElementById('chatList');
    if(list){
      const el = list.querySelector('[data-chat-key="' + snap.key + '"]');
      if(el) el.remove();
      if(!chatMsgs.size && !list.querySelector('.chat-empty')) chatEmptyState(list);
    }
    chatUpdateBadge();
  });

  // Fires after the initial batch of child_added events has been delivered.
  q.once('value', ()=>{
    chatLoaded = true;
    if(chatSeen === null){                       // first visit: don't badge the whole backlog
      chatSeen = chatLatestTs() || Date.now();
      chatLsSet('chatLastSeen', String(chatSeen));
    }
    if(currentTab === 'chat'){ chatRenderAll(); chatMarkSeen(); }
    chatUpdateBadge();
    chatCleanupOld();
  }, fail);

  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState === 'visible' && currentTab === 'chat') chatMarkSeen();
  });
}

initChat();

loadState();
if(BACKEND.mode !== 'firebase'){
  pollTimer = setInterval(pollForUpdates, 4000);
}
</script>
