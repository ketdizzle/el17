<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#16241C">
<meta name="format-detection" content="telephone=no, date=no">
<title>Tournament Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<style>
  :root{
    --board:#16241C;
    --board-alt:#1E3226;
    --board-line: rgba(241,234,218,0.12);
    --amber:#E8B94A;
    --amber-dim: rgba(232,185,74,0.55);
    --cream:#F1EADA;
    --ink:#20261D;
    --red-over:#C1543A;
    --green-under:#6FA05A;
    --radius: 4px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html{ overscroll-behavior-y: contain; }
  button, .clear-x, nav.tabs button, .toplevel-tabs button, summary, .hole-grid button, label{
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
  }
  button:active, .btn:active, .clear-x:active, .toplevel-tabs button:active{
    opacity: 0.7;
  }
  input, select, textarea{
    touch-action: manipulation;
  }
  html,body{margin:0;padding:0;}
  body{
    background: var(--board);
    color: var(--cream);
    font-family:'IBM Plex Sans', sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
  }
  #app{
    width:100%;
    max-width:560px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    background: var(--board);
  }
  header{
    padding: max(22px, env(safe-area-inset-top, 0px)) 20px 16px;
    border-bottom: 1px solid var(--board-line);
    background: linear-gradient(180deg, var(--board-alt), var(--board));
  }
  #tournamentImage{
    width: 100%;
    max-height: 140px;
    object-fit: cover;
    border-radius: 6px;
    margin-bottom: 14px;
  }
  header .eyebrow{
    font-family:'Oswald',sans-serif;
    letter-spacing: 0.04em;
    font-size: 12px;
    color: var(--amber-dim);
    margin: 0 0 4px;
  }
  header h1{
    font-family:'Oswald',sans-serif;
    font-weight:600;
    font-size: 26px;
    margin:0;
    color: var(--amber);
    letter-spacing: 0.01em;
  }
  header .sub{
    font-size: 13px;
    color: var(--cream);
    opacity:0.65;
    margin-top: 4px;
  }
  main{
    flex:1;
    padding: 18px 16px 90px;
    overflow-y:auto;
  }
  nav.tabs{
    position: sticky;
    bottom:0;
    display:flex;
    border-top: 1px solid var(--board-line);
    background: var(--board-alt);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  nav.tabs button{
    flex:1;
    background:none;
    border:none;
    color: var(--cream);
    opacity:0.55;
    font-family:'Oswald',sans-serif;
    font-size: 12px;
    letter-spacing:0.02em;
    padding: 14px 2px 12px;
    cursor:pointer;
    border-top: 2px solid transparent;
  }
  nav.tabs button.active{
    opacity:1;
    color: var(--amber);
    border-top: 2px solid var(--amber);
  }
  h2.section-title{
    font-family:'Oswald',sans-serif;
    font-weight:500;
    font-size: 15px;
    letter-spacing:0.02em;
    color: var(--amber);
    margin: 22px 0 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--board-line);
  }
  h2.section-title:first-child{ margin-top:0; }
  h3.sub-title{
    font-family:'Oswald',sans-serif;
    font-weight:500;
    font-size: 13px;
    color: var(--cream);
    opacity: 0.75;
    margin: 14px 0 8px;
  }
  .card{
    background: var(--board-alt);
    border: 1px solid var(--board-line);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 12px;
  }
  .lb-row{
    display:flex;
    align-items:center;
    padding: 10px 2px;
    border-bottom: 1px solid var(--board-line);
  }
  .lb-row:last-child{border-bottom:none;}
  .lb-rank{
    width: 26px;
    font-family:'Oswald',sans-serif;
    color: var(--amber-dim);
    font-size: 14px;
  }
  .lb-name{
    flex:1;
    font-size: 15px;
    font-weight:500;
  }
  .lb-name .hcp{
    font-size:11px;
    opacity:0.5;
    font-weight:400;
    margin-left:6px;
  }
  .lb-score{
    font-family:'Oswald',sans-serif;
    font-size: 20px;
    font-variant-numeric: tabular-nums;
    min-width: 46px;
    text-align:right;
  }
  .lb-score.dim{ opacity:0.35; }
  select, input[type=text], input[type=number], input[type=date]{
    width:100%;
    background: var(--cream);
    color: var(--ink);
    border: none;
    border-radius: var(--radius);
    padding: 12px 12px;
    font-size: 16px;
    font-family:'IBM Plex Sans', sans-serif;
    margin-bottom: 12px;
  }
  input[type=number].hole-input{
    padding: 8px 4px;
    text-align:center;
    font-family:'Oswald',sans-serif;
    margin-bottom:0;
  }
  label{
    display:block;
    font-size: 12px;
    color: var(--amber-dim);
    margin-bottom: 6px;
    font-family:'Oswald',sans-serif;
    letter-spacing:0.02em;
  }
  .btn{
    width:100%;
    background: var(--amber);
    color: var(--ink);
    border:none;
    border-radius: var(--radius);
    padding: 13px;
    font-family:'Oswald',sans-serif;
    font-size: 15px;
    letter-spacing:0.02em;
    font-weight:600;
    cursor:pointer;
  }
  .btn.secondary{
    background: transparent;
    border: 1px solid var(--amber-dim);
    color: var(--amber);
  }
  .btn.tiny{
    width:auto;
    padding: 6px 12px;
    font-size: 12px;
  }
  .hole-grid{
    display:grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 6px;
    margin-bottom: 14px;
  }
  .hole-grid button{
    aspect-ratio: 1;
    background: var(--board);
    border: 1px solid var(--board-line);
    color: var(--cream);
    border-radius: var(--radius);
    font-family:'Oswald',sans-serif;
    font-size:14px;
    cursor:pointer;
    position:relative;
  }
  .hole-grid button.active{
    background: var(--amber);
    color: var(--ink);
    border-color: var(--amber);
  }
  .hole-grid button .dot{
    position:absolute;
    top:3px; right:4px;
    width:5px; height:5px;
    border-radius:50%;
    background: var(--green-under);
  }
  .row-flex{ display:flex; gap:8px; align-items:center; }
  .row-flex > *{flex:1;}
  .list-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 8px 0;
    border-bottom: 1px solid var(--board-line);
    font-size: 14px;
    gap:8px;
  }
  .list-item:last-child{border-bottom:none;}
  .list-item input[type=number]{ width: 70px; margin:0; padding:8px; }
  .remove-x{
    color: var(--red-over);
    background:none;
    border:none;
    font-size: 18px;
    cursor:pointer;
    padding: 0 6px;
  }
  .muted{ color: var(--cream); opacity:0.55; font-size:13px; }
  .status-msg{ text-align:center; font-size: 13px; color: var(--amber); margin-top: 10px; min-height: 18px; }
  .empty-state{ text-align:center; padding: 40px 20px; color: var(--cream); opacity:0.5; font-size: 14px; }
  .tag{
    display:inline-block;
    font-family:'Oswald',sans-serif;
    font-size: 11px;
    color: var(--amber-dim);
    border: 1px solid var(--amber-dim);
    border-radius: 3px;
    padding: 2px 6px;
    margin-left: 6px;
  }
  .scorecard-grid{
    display:grid;
    grid-template-columns: 34px 1fr 1fr;
    gap:4px 8px;
    align-items:center;
    font-size:13px;
  }
  .scorecard-grid .hdr{
    font-family:'Oswald',sans-serif;
    color: var(--amber-dim);
    font-size:11px;
    padding-bottom:4px;
    border-bottom: 1px solid var(--board-line);
    margin-bottom:4px;
  }
  .scorecard-grid .hole-num{
    font-family:'Oswald',sans-serif;
    color: var(--cream);
    opacity:0.6;
  }
  .toplevel-tabs{
    display:flex;
    gap:6px;
    margin-bottom:16px;
    flex-wrap:wrap;
  }
  .toplevel-tabs button{
    background: var(--board-alt);
    border:1px solid var(--board-line);
    color: var(--cream);
    opacity:0.6;
    font-family:'Oswald',sans-serif;
    font-size:12px;
    padding: 8px 12px;
    border-radius: 3px;
    cursor:pointer;
  }
  .toplevel-tabs button.active{
    opacity:1;
    color: var(--ink);
    background: var(--amber);
    border-color: var(--amber);
  }
  .group-box{
    border: 1px solid var(--board-line);
    border-radius: var(--radius);
    padding: 10px 12px;
    margin-bottom: 10px;
  }
  .group-box .group-label{
    font-family:'Oswald',sans-serif;
    font-size: 12px;
    color: var(--amber-dim);
    margin-bottom:8px;
  }
  .group-box select{ margin-bottom: 8px; }
  .group-box select:last-of-type{ margin-bottom:0; }
  details{ margin-bottom: 12px; }
  summary{
    cursor:pointer;
    font-family:'Oswald',sans-serif;
    font-size:13px;
    color: var(--amber);
    padding: 6px 0;
  }
  details.lb-details{ margin-bottom: 0; }
  summary.section-title{
    cursor:pointer;
    list-style:none;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  summary.section-title::-webkit-details-marker{ display:none; }
  summary.section-title::after{
    content:'▾';
    font-size:12px;
    color: var(--amber-dim);
    margin-left:10px;
    transform: rotate(-90deg);
    transition: transform 0.15s ease;
  }
  details[open]>summary.section-title::after{ transform: rotate(0deg); }
  .hole-list{
    padding: 6px 12px;
  }
  .hole-row{
    display:flex;
    align-items:center;
    gap: 10px;
    padding: 9px 0;
    border-bottom: 1px solid var(--board-line);
  }
  .hole-row:last-child{ border-bottom:none; }
  .hole-row-num{
    font-family:'Oswald',sans-serif;
    font-size: 16px;
    color: var(--amber);
    width: 22px;
    text-align:center;
    flex-shrink:0;
  }
  .hole-row-par{
    font-size: 12px;
    color: var(--cream);
    opacity: 0.5;
    width: 46px;
    flex-shrink:0;
  }
  .hole-row-input{
    flex:1;
    text-align:center;
    font-family:'Oswald',sans-serif;
    font-size: 17px;
    margin-bottom:0;
    padding: 9px 6px;
  }
  .clear-x{
    background:none;
    border:none;
    color: var(--red-over);
    font-size: 20px;
    line-height:1;
    width: 22px;
    flex-shrink:0;
    cursor:pointer;
  }
  .hole-row-status{
    font-size: 11px;
    color: var(--green-under);
    width: 44px;
    flex-shrink:0;
    text-align:right;
    opacity:0;
    transition: opacity 0.2s;
  }
  .hole-row-status.show{ opacity:1; }
  .hole-row-status.error{ color: var(--red-over); }
  .hole-row{ flex-wrap: wrap; }
  .hole-extra{
    flex-basis: 100%;
    display:flex;
    align-items:center;
    gap: 8px;
    margin-top: 6px;
    padding-left: 32px;
    font-size: 12px;
    color: var(--amber-dim);
    font-family:'Oswald',sans-serif;
  }
  .hole-extra input[type=number]{
    width: 58px;
    padding: 6px 4px;
    margin: 0;
    text-align:center;
    font-family:'IBM Plex Sans', sans-serif;
    font-size: 16px;
  }
  .hole-extra label{
    display:flex;
    align-items:center;
    gap: 5px;
    margin:0;
    font-size: 13px;
    color: var(--cream);
    opacity:0.85;
    cursor:pointer;
  }
  .hole-extra input[type=checkbox]{
    width:16px; height:16px; margin:0;
  }
  .kp-ld-card{
    display:flex;
    flex-direction:column;
    gap: 10px;
  }
  .kp-ld-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding: 6px 2px;
  }
  .kp-ld-label{
    font-family:'Oswald',sans-serif;
    font-size: 12px;
    color: var(--amber-dim);
  }
  .kp-ld-value{
    font-size: 14px;
    text-align:right;
  }
  .lb-score-wrap{
    display:flex;
    flex-direction:row;
    align-items:baseline;
    justify-content:flex-end;
    gap: 8px;
    min-width: 46px;
  }
  .lb-topar{
    font-family:'Oswald',sans-serif;
    font-size: 20px;
    font-variant-numeric: tabular-nums;
    letter-spacing:0.02em;
  }
  .lb-topar.under{ color: var(--green-under); }
  .lb-topar.over{ color: var(--red-over); }
  .lb-topar.even{ color: var(--amber-dim); }
  .lb-thru{
    font-family:'Oswald',sans-serif;
    font-size: 13px;
    letter-spacing:0.02em;
    color: var(--text-dim, #9aa0a6);
    text-transform: uppercase;
  }

  /* ---- Password sign-in popup ---- */
  .auth-overlay{
    position:fixed; inset:0; z-index:1000;
    background: rgba(10,18,13,0.82);
    display:flex; align-items:center; justify-content:center;
    padding:20px;
  }
  .auth-box{
    width:100%; max-width:360px;
    background: var(--board-alt);
    border:1px solid var(--board-line);
    border-top:3px solid var(--amber);
    border-radius: var(--radius);
    padding:20px 18px 16px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.5);
  }
  .auth-title{
    font-family:'Oswald',sans-serif;
    font-size:20px; letter-spacing:0.02em;
    color: var(--amber);
    margin-bottom:6px;
  }
  .auth-msg{ font-size:13px; line-height:1.4; opacity:0.75; margin:0 0 14px; }
  .auth-input{
    width:100%;
    background: var(--cream); color: var(--ink);
    border:none; border-radius: var(--radius);
    padding:12px; font-size:16px;
    font-family:'IBM Plex Sans', sans-serif;
    margin-bottom:8px;
  }
  .auth-error{ min-height:18px; font-size:12px; color:#E58A72; margin-bottom:10px; }
  .auth-actions{ display:flex; gap:10px; }
  .auth-actions .btn{ flex:1; }
  /* ---------- CHAT TAB ---------- */
  nav.tabs button{ position:relative; }
  nav.tabs button.chat-unread:not(.active){ opacity:1; color: var(--amber); }
  .chat-badge{
    position:absolute; top:5px; left:50%; margin-left:12px;
    min-width:16px; height:16px; padding:0 4px; border-radius:8px;
    background: var(--red-over); color:#fff;
    font-family:'Oswald',sans-serif; font-size:10px; line-height:16px; text-align:center;
  }
  .chat-badge[hidden]{ display:none; }
  .chat-wrap{ position:relative; }
  .chat-list{
    height:50vh; height:50dvh; min-height:260px; max-height:520px;
    overflow-y:auto; overscroll-behavior:contain; -webkit-overflow-scrolling:touch;
    background: rgba(0,0,0,0.18);
    border:1px solid var(--board-line); border-radius: var(--radius);
    padding:10px; display:flex; flex-direction:column; gap:8px;
  }
  .chat-row{ display:flex; flex:0 0 auto; }
  .chat-row.mine{ justify-content:flex-end; }
  .chat-bubble{
    max-width:82%;
    background: var(--board-alt); border:1px solid var(--board-line);
    border-radius:10px 10px 10px 2px; padding:7px 10px 8px;
  }
  .chat-row.mine .chat-bubble{
    background: var(--amber); color: var(--ink); border-color:transparent;
    border-radius:10px 10px 2px 10px;
  }
  .chat-meta{ display:flex; align-items:baseline; gap:8px; margin-bottom:2px; }
  .chat-name{ font-family:'Oswald',sans-serif; font-size:12px; letter-spacing:0.02em; font-weight:500; }
  .chat-row.mine .chat-name{ color: var(--ink); opacity:0.75; }
  .chat-time{ font-size:10px; opacity:0.5; white-space:nowrap; }
  .chat-text{ font-size:15px; line-height:1.35; white-space:pre-wrap; overflow-wrap:anywhere; word-break:break-word; }
  .chat-del{
    margin-left:auto; background:none; border:none; padding:0 2px;
    color: var(--red-over); font-size:18px; line-height:1; cursor:pointer;
  }
  .chat-row.mine .chat-del{ color: var(--ink); }
  .chat-empty{ margin:auto; opacity:0.5; font-size:13px; text-align:center; }
  .chat-newpill{
    position:absolute; bottom:10px; left:50%; transform:translateX(-50%);
    background: var(--amber); color: var(--ink); border:none; border-radius:999px;
    padding:6px 14px; font-family:'Oswald',sans-serif; font-size:12px; letter-spacing:0.02em;
    box-shadow:0 2px 8px rgba(0,0,0,0.45); cursor:pointer;
  }
  .chat-newpill[hidden]{ display:none; }
  .chat-status{ font-size:12px; color: var(--red-over); margin-bottom:8px; }
  .chat-status[hidden]{ display:none; }
  .chat-inputrow{ display:flex; gap:8px; align-items:stretch; margin-top:10px; }
  .chat-inputrow input[type=text]{ flex:1; min-width:0; margin-bottom:0; }
  .chat-inputrow .btn{ width:auto; padding:0 20px; }
  .chat-as, .chat-foot{ font-size:12px; opacity:0.65; margin-top:10px; }
  .chat-as{ margin-top:12px; }
  .chat-join{ margin:12px 0 0; }
  .chat-join .chat-inputrow{ margin-top:0; }
  .chat-link{
    background:none; border:none; padding:0; color: var(--amber);
    font:inherit; text-decoration:underline; cursor:pointer;
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <img id="tournamentImage" src="" alt="" style="display:none;">
    <p class="eyebrow">LIVE SCOREBOARD</p>
    <h1 id="tournamentName">Tournament</h1>
    <p class="sub" id="headerSub">loading...</p>
  </header>
  <main id="main"></main>
  <nav class="tabs">
    <button data-tab="leaderboard" class="active">BOARD</button>
    <button data-tab="enter">ENTER</button>
    <button data-tab="chat">CHAT<span class="chat-badge" id="chatBadge" hidden></span></button>
    <button data-tab="setup">SETUP</button>
  </nav>
</div>

<script>
const STORAGE_KEY = 'tournament-data-v2';

// Firebase Authentication accounts (create both in Firebase Console → Authentication → Users).
// Only the EMAIL addresses live here — the passwords never appear in this file.
const SCORER_EMAIL = 'el17@ellajore.golf';   // shared by everyone entering scores
const ADMIN_EMAIL  = 'admin@ellajore.golf';   // organizer only — Setup tab and all settings changes

const ROSTER_R1 = ['Surag','Niki','Woody','Sanjay','Ketal','Vikas','Shiv','Shaan','Samir','James','Parag','Ian','Roshan','Cham','Rishee','Archish'];

// partnerOrder[i] = which slot (1,2,or3) pairs with slot 0 during segment i (holes 1-6, 7-12, 13-18).
// The other two slots automatically pair with each other.
const QUADS_R1 = [
  { players:['Surag','Niki','Woody','Sanjay'], partnerOrder:[2,3,1] },
  { players:['Ketal','Vikas','Shiv','Shaan'],   partnerOrder:[3,1,2] },
  { players:['Samir','James','Parag','Ian'],    partnerOrder:[2,3,1] },
  { players:['Roshan','Cham','Rishee','Archish'], partnerOrder:[2,3,1] }
];

// Pre-loaded scorecards, keyed by exact course name as entered in Setup.
const KNOWN_SCORECARDS = {
  'Twin Warriors': {
    par:      [5,4,4,3,4,4,4,5,3, 4,4,5,3,4,3,5,4,4],
    hcpIndex: [9,7,3,15,13,11,1,5,17, 2,16,4,14,18,12,8,10,6]
  },
  'Paako Ridge': {
    par:      [4,4,5,3,5,4,4,3,4, 4,4,5,4,3,5,3,4,4],
    hcpIndex: [13,11,5,17,7,15,1,9,3, 10,2,14,16,8,4,18,12,6]
  },
  'Sandia Resort': {
    par:      [4,4,3,4,5,4,5,3,4, 4,5,3,4,4,4,3,5,4],
    hcpIndex: [11,3,17,15,5,1,9,13,7, 12,2,18,16,4,8,10,14,6]
  }
};
let state = null;
let currentTab = 'leaderboard';
let lbView = 'overall'; // overall | r1 | r2 | r3
let entrySel = { round: 'r1', player: '', hole: 1 };
let entryMode = 'player'; // 'player' | 'hole'
let pollTimer = null;
// Tracks open/closed state of <details> sections across re-renders (not persisted to backend, per-browser only).
const uiDetailsState = {};

// Wraps a leaderboard section in a collapsible <details>, defaulting to open the first time it's seen.

// ============================================================
// FIREBASE SDK SETUP (real-time listener instead of REST polling)
//
// Using the actual Firebase SDK with a persistent WebSocket connection means
// the browser downloads the full state once on load, then only the small
// delta whenever something changes — instead of re-downloading the entire
// state every few seconds via REST polling. This is the main lever for
// staying well under the 360 MB/day free-tier download limit as more people
// use the app during a round.
// ============================================================
let fbApp = null, fbDb = null, fbAuth = null;              // default app: public reads + scorer sign-in
let fbAdminApp = null, fbAdminAuth = null;                  // second app: organizer sign-in (its database is opened on demand)
if(BACKEND.mode === 'firebase'){
  fbApp = firebase.initializeApp(BACKEND.firebaseConfig);
  fbDb = fbApp.database();
  fbAuth = fbApp.auth();
  fbAdminApp = firebase.initializeApp(BACKEND.firebaseConfig, 'admin');
  fbAdminAuth = fbAdminApp.auth();
  // Organizer session lasts only until this browser tab is closed.
  fbAdminAuth.setPersistence(firebase.auth.Auth.Persistence.SESSION).catch(()=>{});
}

// ============================================================
// SIGN-IN & WRITE ACCESS (Firebase mode only — Spark/free plan, no server needed)
//
// Two Firebase Authentication accounts protect the database. Their passwords
// are set in the Firebase Console and typed into the sign-in popup by people
// — they are never stored in this file or in the database.
//
//   SCORER_EMAIL  shared by everyone entering scores. The Database Rules let
//                 it write ONLY scores, closest-to-pin and longest-drive.
//   ADMIN_EMAIL   organizer only. The Database Rules let it write everything
//                 (players, handicaps, rounds, settings, restore-from-backup).
//
// The Database Rules (database.rules.json) are the real gate. Anyone can read
// this file, so the checks below only decide when to show the sign-in popup;
// a visitor who skips them still cannot write anything. Reads stay public so
// the leaderboard works without signing in.
//
// Two separate Firebase app instances are used so the scorer session stays
// signed in on the device, while the organizer session ends when the browser
// tab is closed.
// ============================================================
const SCORING_KEYS = ['scores','kp','ld'];
let pendingScorerLogin = null;
let pendingAdminLogin = null;

// Resolves once Firebase has finished restoring any saved session.
function authReady(auth){
  return new Promise(resolve=>{
    let done = false, unsub = null;
    unsub = auth.onAuthStateChanged(user=>{
      if(done) return;
      done = true;
      resolve(user);
      if(unsub) unsub();
    });
    if(done && unsub) unsub();
  });
}

function isSignedInAs(auth, email){
  return !!(auth && auth.currentUser && auth.currentUser.email === email);
}

// Password popup (replaces the browser's plain-text prompt). Resolves with the
// typed password, or null if the person cancels.
function askPassword(title, message, errorText, email){
  return new Promise(resolve=>{
    const overlay = document.createElement('div');
    overlay.className = 'auth-overlay';
    overlay.innerHTML = `
      <form class="auth-box" autocomplete="on">
        <div class="auth-title">${escapeHtml(title)}</div>
        <p class="auth-msg">${escapeHtml(message)}</p>
        <input type="text" name="username" value="${escapeAttr(email||'')}" autocomplete="username" style="display:none" tabindex="-1" aria-hidden="true">
        <input type="password" class="auth-input" name="password" placeholder="Password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false">
        <div class="auth-error" role="alert">${escapeHtml(errorText||'')}</div>
        <div class="auth-actions">
          <button type="button" class="btn secondary" data-auth-cancel>Cancel</button>
          <button type="submit" class="btn">Sign in</button>
        </div>
      </form>`;
    document.body.appendChild(overlay);
    const form = overlay.querySelector('form');
    const input = overlay.querySelector('.auth-input');
    const finish = (value)=>{
      document.removeEventListener('keydown', onKey, true);
      overlay.remove();
      resolve(value);
    };
    const onKey = (e)=>{ if(e.key === 'Escape') finish(null); };
    document.addEventListener('keydown', onKey, true);
    form.addEventListener('submit', (e)=>{
      e.preventDefault();
      if(!input.value){ input.focus(); return; }
      finish(input.value);
    });
    overlay.querySelector('[data-auth-cancel]').addEventListener('click', ()=> finish(null));
    setTimeout(()=> input.focus(), 50);
  });
}

// Asks for the password (up to 5 tries) and signs the given account in.
// Returns true on success, false if cancelled or out of tries.
async function signInWithPrompt(auth, email, title, message){
  let errorText = '';
  for(let attempt = 0; attempt < 5; attempt++){
    const pw = await askPassword(title, message, errorText, email);
    if(pw === null) return false;
    try{
      await auth.signInWithEmailAndPassword(email, pw);
      return true;
    }catch(err){
      const code = err && err.code;
      if(code === 'auth/too-many-requests'){
        alert('Too many failed attempts. Wait a few minutes, then try again.');
        return false;
      }
      if(code === 'auth/network-request-failed') errorText = 'Network problem — check your connection and try again.';
      else if(code === 'auth/operation-not-allowed') errorText = 'Email/password sign-in is not enabled in Firebase.';
      else if(code === 'auth/user-disabled') errorText = 'This account has been disabled.';
      else if(['auth/invalid-credential','auth/wrong-password','auth/invalid-login-credentials','auth/user-not-found','auth/invalid-email','auth/missing-password'].includes(code)) errorText = 'Incorrect password.';
      else errorText = 'Sign-in failed (' + (code || 'unknown error') + ').';
    }
  }
  return false;
}

// Organizer session — needed for Setup and every settings/roster change.
async function ensureAdminSession(){
  await authReady(fbAdminAuth);
  if(!isSignedInAs(fbAdminAuth, ADMIN_EMAIL)){
    if(!pendingAdminLogin){
      pendingAdminLogin = signInWithPrompt(fbAdminAuth, ADMIN_EMAIL, 'Organizer sign-in',
        'Enter the organizer password to open Setup and change tournament settings.')
        .finally(()=>{ pendingAdminLogin = null; });
    }
    const ok = await pendingAdminLogin;
    if(!ok) throw new Error('Organizer sign-in required.');
  }
  return { db: fbAdminApp.database(), auth: fbAdminAuth };
}

// Score-entry session — the shared scorer account (an organizer who is already
// signed in may also record scores without a second password).
async function ensureScoringSession(){
  await Promise.all([authReady(fbAuth), authReady(fbAdminAuth)]);
  if(isSignedInAs(fbAuth, SCORER_EMAIL)) return { db: fbDb, auth: fbAuth };
  if(isSignedInAs(fbAdminAuth, ADMIN_EMAIL)) return { db: fbAdminApp.database(), auth: fbAdminAuth };
  if(!pendingScorerLogin){
    pendingScorerLogin = signInWithPrompt(fbAuth, SCORER_EMAIL, 'Score entry sign-in',
      'Enter the scorer password to record scores.')
      .finally(()=>{ pendingScorerLogin = null; });
  }
  const ok = await pendingScorerLogin;
  if(!ok) throw new Error('Scorer sign-in required.');
  return { db: fbDb, auth: fbAuth };
}

// Runs a write with the right session. If the database rejects it (for
// example the password was changed and the old session is no longer accepted),
// the stale session is signed out and the person is asked to sign in again once.
async function withSession(getSession, doWrite){
  for(let attempt = 0; attempt < 2; attempt++){
    const { db, auth } = await getSession();
    try{
      await doWrite(db);
      return;
    }catch(err){
      if(err && err.code === 'PERMISSION_DENIED' && attempt === 0){
        try{ await auth.signOut(); }catch(_){}
        continue;
      }
      throw err;
    }
  }
}

async function backendGet(){
  if(BACKEND.mode === 'rest'){
    return fetchJsonOrNull(BACKEND.restUrl, {}, 'rest get');
  }
  if(BACKEND.mode === 'firebase'){
    const snapshot = await fbDb.ref('tournament').once('value');
    return snapshot.val() || null;
  }
  if(BACKEND.mode === 'sheets'){
    return fetchJsonOrNull(BACKEND.sheetsUrl + '?action=get', {}, 'sheets get');
  }
  throw new Error('Unknown BACKEND.mode: ' + BACKEND.mode);
}

async function fetchJsonOrNull(url, options, label){
  const res = await fetch(url, options);
  if(!res.ok) throw new Error(label + ' failed: ' + res.status);
  const data = await res.json();
  return (data && Object.keys(data).length) ? data : null;
}

async function backendSet(stateObj, opts){
  if(BACKEND.mode === 'rest'){
    const res = await fetch(BACKEND.restUrl, {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(stateObj)
    });
    if(!res.ok) throw new Error('rest set failed: ' + res.status);
    return;
  }
  if(BACKEND.mode === 'firebase'){
    // Organizer-only write. Normally this saves just the settings/roster/rounds
    // fields and leaves scores, closest-to-pin and longest-drive untouched, so
    // an organizer editing Setup can never overwrite entries other people are
    // recording. A full restore-from-backup passes { full: true } to replace
    // everything. (The Database Rules only allow the organizer account here.)
    try{
      await withSession(ensureAdminSession, async (db)=>{
        if(opts && opts.full){
          const all = { ...stateObj };
          delete all._pinHash;
          await db.ref('tournament').set(all);
        }else{
          const cfg = {};
          Object.keys(stateObj).forEach(k=>{
            if(!SCORING_KEYS.includes(k) && k !== '_pinHash') cfg[k] = stateObj[k];
          });
          cfg._pinHash = null; // removes the leftover field from the old PIN scheme
          await db.ref('tournament').update(cfg);
        }
      });
    }catch(e){
      if(e && e.message === 'Organizer sign-in required.') alert('Change not saved — organizer sign-in is required.');
      throw e;
    }
    return;
  }
  if(BACKEND.mode === 'sheets'){
    // Apps Script web apps need text/plain to avoid a CORS preflight.
    const res = await fetch(BACKEND.sheetsUrl, {
      method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ action:'set', data: stateObj })
    });
    if(!res.ok) throw new Error('sheets set failed: ' + res.status);
    return;
  }
  throw new Error('Unknown BACKEND.mode: ' + BACKEND.mode);
}

function blankHolesLocal18(){ return Array.from({length:18}, ()=>null); }

const ROUND_RATING_SLOPE_DEFAULTS = { r1:{rating:69.9, slope:133}, r2:{rating:69.7, slope:132}, r3:{rating:69.8, slope:129} };

function normalizeState(s){
  if(!s || typeof s !== 'object') return defaultState();
  if(!Array.isArray(s.players)) s.players = [];
  s.players = s.players.map(p=>({
    name: (p && p.name) || 'Player',
    handicap: (p && Number(p.handicap)) || 0
  }));
  if(!Array.isArray(s.rounds)) s.rounds = defaultState().rounds;
  s.rounds = s.rounds.map(r=>({
    id: r.id,
    label: r.label || r.id,
    course: r.course || '',
    date: r.date || '',
    format: r.format || 'stroke',
    visible: r.visible !== false,
    rating: (r.rating !== undefined && r.rating !== null && r.rating !== '') ? Number(r.rating) : ((ROUND_RATING_SLOPE_DEFAULTS[r.id] && ROUND_RATING_SLOPE_DEFAULTS[r.id].rating) || null),
    slope: (r.slope !== undefined && r.slope !== null && r.slope !== '') ? Number(r.slope) : ((ROUND_RATING_SLOPE_DEFAULTS[r.id] && ROUND_RATING_SLOPE_DEFAULTS[r.id].slope) || null),
    par: Array.isArray(r.par) && r.par.length===18 ? r.par : blankHolesLocal18(),
    hcpIndex: Array.isArray(r.hcpIndex) && r.hcpIndex.length===18 ? r.hcpIndex : blankHolesLocal18(),
    groups: Array.isArray(r.groups) ? r.groups : [],
    quads: Array.isArray(r.quads) ? r.quads : [],
    pairs: Array.isArray(r.pairs) ? r.pairs : [],
    teeGroups: Array.isArray(r.teeGroups) ? r.teeGroups : [],
    kpHoles: Array.isArray(r.kpHoles) ? r.kpHoles : ((ROUND_KP_LD_DEFAULTS[r.id] && ROUND_KP_LD_DEFAULTS[r.id].kp.slice()) || []),
    ldHoles: Array.isArray(r.ldHoles) ? r.ldHoles : ((ROUND_KP_LD_DEFAULTS[r.id] && ROUND_KP_LD_DEFAULTS[r.id].ld.slice()) || []),
    logoUrl: r.logoUrl || '',
    teeBox: r.teeBox || '',
    firstTeeTime: r.firstTeeTime || '',
    totalYardage: r.totalYardage || '',
    useCourseHandicap: (r.useCourseHandicap === true || r.useCourseHandicap === false) ? r.useCourseHandicap : null,
    handicapOverrides: (r.handicapOverrides && typeof r.handicapOverrides === 'object') ? r.handicapOverrides : {}
  }));
  if(!s.scores || typeof s.scores !== 'object') s.scores = {};
  if(!s.kp || typeof s.kp !== 'object') s.kp = {};
  if(!s.ld || typeof s.ld !== 'object') s.ld = {};
  if(typeof s.useCourseHandicap !== 'boolean') s.useCourseHandicap = false;
  if(!s.name) s.name = 'Golf Tournament';
  if(!s.tournamentImageUrl) s.tournamentImageUrl = '';
  delete s._pinHash; // leftover from the old PIN scheme; never app data
  return s;
}

async function loadState(){
  if(BACKEND.mode === 'firebase'){
    // Real-time listener: fires immediately with current data, then again
    // only when something actually changes — no repeated polling needed.
    return new Promise((resolve)=>{
      let seeded = false, firstLoad = true;
      fbDb.ref('tournament').on('value', async (snapshot)=>{
        // Avoid clobbering in-progress typing: while the user is on Setup or
        // Enter, those screens manage their own targeted reads/writes
        // (see debounceMergeSave), so skip applying a full-state refresh here.
        if(!firstLoad && (currentTab === 'setup' || currentTab === 'enter')) return;
        const data = snapshot.val();
        state = normalizeState(data);
        // If the database is empty, defaults are shown locally; the first
        // organizer save in Setup writes them (visitors can't write).
        if(!entrySel.player && state.players.length) entrySel.player = state.players[0].name;
        render();
        if(firstLoad){ firstLoad = false; resolve(); }
      }, (err)=>{ console.error('firebase listener error', err); resolve(); });
    });
  }
  try{
    const data = await backendGet();
    state = normalizeState(data);
    if(!data) await saveState();
  }catch(e){
    console.error('load failed', e);
    state = defaultState();
    try{ await saveState(); }catch(e2){ console.error('initial save failed', e2); }
  }
  if(!entrySel.player && state.players.length) entrySel.player = state.players[0].name;
  render();
}

async function saveState(opts){
  try{
    await backendSet(state, opts);
  }catch(e){
    console.error('save failed', e);
    // The write was rejected (e.g. sign-in cancelled). Whatever change was
    // made to `state` in memory never actually reached the database, so pull
    // the real server state back down and re-render — otherwise the failed
    // edit keeps showing locally until the next unrelated page refresh.
    try{
      const serverState = await backendGet();
      state = normalizeState(serverState);
      render();
    }catch(e2){ /* if this also fails, we'll self-correct on the next successful sync */ }
    throw e; // let the caller know the save didn't happen (e.g. to show its own "Failed" status)
  }
}

function getRound(id){ return state.rounds.find(r=>r.id===id); }
function sortedPlayers(){ return [...state.players].sort((a,b)=>a.name.localeCompare(b.name)); }
function scoreKey(roundId, player, hole){ return `${roundId}__${player}__${hole}`; }
function kpKey(roundId, player, hole){ return `${roundId}__${player}__${hole}`; }
function ldKey(roundId, player, hole){ return `${roundId}__${player}__${hole}`; }
function getScore(roundId, player, hole){
  const v = state.scores[scoreKey(roundId, player, hole)];
  return (v===undefined || v===null || v==='') ? null : Number(v);
}

// --- Handicap strokes received on a given hole, based on hole's stroke index (1=hardest) ---
function strokesReceived(handicap, hcpIndexOfHole){
  if(!handicap || handicap <= 0 || !hcpIndexOfHole) return 0;
  const h = Math.round(handicap);
  const base = Math.floor(h/18);
  const remainder = h % 18;
  return base + (hcpIndexOfHole <= remainder ? 1 : 0);
}

// Converts a Handicap Index into a Course Handicap for a specific round,
// using the standard formula: Index × (Slope / 113) + (Rating − Par).
// Falls back to the index as-is if rating/slope/par aren't fully set up yet.
function courseHandicap(round, handicapIndex){
  const idx = Number(handicapIndex) || 0;
  const rating = Number(round.rating);
  const slope = Number(round.slope);
  const par = round.par && round.par.length ? round.par.reduce((a,b)=>a+(Number(b)||0),0) : 0;
  if(!rating || !slope || !par) return idx;
  return Math.round(idx * (slope/113) + (rating - par));
}

// Whether this round should use Course Handicap: round-level setting wins if explicitly
// set (true/false); otherwise falls back to the tournament-wide default.
function roundUsesCourseHandicap(round){
  if(round.useCourseHandicap === true) return true;
  if(round.useCourseHandicap === false) return false;
  return !!state.useCourseHandicap;
}

// A player's handicap for a specific round: uses that round's override if set,
// otherwise falls back to the player's base handicap from Setup.
function effectiveHandicapIndex(round, playerName){
  const override = round.handicapOverrides ? round.handicapOverrides[playerName] : undefined;
  if(override !== undefined && override !== null && override !== '') return Number(override);
  const p = state.players.find(pl=>pl.name===playerName);
  return p ? Number(p.handicap)||0 : 0;
}

// The actual number of strokes applied for a player in a round, after resolving
// per-round handicap overrides and the Course Handicap toggle.
function playerRoundHandicap(round, playerName){
  const idx = effectiveHandicapIndex(round, playerName);
  return roundUsesCourseHandicap(round) ? courseHandicap(round, idx) : idx;
}

function roundGrossTotal(roundId, player){
  const round = getRound(roundId);
  let total=0, count=0, parSum=0, parCount=0;
  for(let h=1; h<=18; h++){
    const v = getScore(roundId, player, h);
    if(v!==null){
      total+=v; count++;
      const par = round.par[h-1];
      if(par!==null && par!==undefined && par!==''){ parSum += Number(par); parCount++; }
    }
  }
  const toPar = (count>0 && parCount===count) ? total - parSum : null;
  return {total, count, toPar};
}

function roundNetTotal(roundId, player){
  const round = getRound(roundId);
  const hcp = playerRoundHandicap(round, player);
  let total=0, count=0, parSum=0, parCount=0;
  for(let h=1; h<=18; h++){
    const v = getScore(roundId, player, h);
    if(v!==null){
      const hi = round.hcpIndex[h-1];
      total += v - strokesReceived(hcp, hi ? Number(hi) : null);
      count++;
      const par = round.par[h-1];
      if(par!==null && par!==undefined && par!==''){ parSum += Number(par); parCount++; }
    }
  }
  const toPar = (count>0 && parCount===count) ? total - parSum : null;
  return {total, count, toPar};
}

// --- Individual Sixes: rotating 1-on-1 net-score matchups within a foursome ---
// partnerOrder[segment] = which slot (1,2,or3) pairs with slot 0 during that 6-hole segment.
// The other two slots automatically pair with each other.
function quadPairsForSegment(quad, segIdx){
  const partnerSlot = quad.partnerOrder[segIdx];
  const otherSlots = [1,2,3].filter(s=>s!==partnerSlot);
  return [
    [quad.players[0], quad.players[partnerSlot]],
    [quad.players[otherSlots[0]], quad.players[otherSlots[1]]]
  ];
}

function netHoleScore(round, player, hole){
  const gross = getScore(round.id, player, hole);
  if(gross===null) return null;
  const hcp = playerRoundHandicap(round, player);
  const hi = round.hcpIndex[hole-1];
  return gross - strokesReceived(hcp, hi ? Number(hi) : null);
}

function sixesTotalsForRound(roundId){
  const round = getRound(roundId);
  const totals = {};
  state.players.forEach(p=>totals[p.name]=0);
  (round.quads||[]).forEach(quad=>{
    if(quad.players.filter(Boolean).length !== 4) return;
    for(let seg=0; seg<3; seg++){
      const pairs = quadPairsForSegment(quad, seg);
      const holeStart = seg*6+1, holeEnd = seg*6+6;
      for(let h=holeStart; h<=holeEnd; h++){
        pairs.forEach(([pa,pb])=>{
          if(!pa || !pb) return;
          const sa = netHoleScore(round, pa, h), sb = netHoleScore(round, pb, h);
          if(sa===null || sb===null) return;
          if(sa < sb) totals[pa] = (totals[pa]||0) + 2;
          else if(sb < sa) totals[pb] = (totals[pb]||0) + 2;
          else { totals[pa] = (totals[pa]||0) + 1; totals[pb] = (totals[pb]||0) + 1; }
        });
      }
    }
  });
  return totals;
}

// --- Team Pairs: best-ball gross + best-ball net, per hole, summed over the round ---
function pairsTotalsForRound(roundId){
  const round = getRound(roundId);
  const results = [];
  (round.pairs||[]).forEach((pair, pi)=>{
    if(pair.players.filter(Boolean).length !== 2) return;
    const [a,b] = pair.players;
    let total = 0, count = 0;
    for(let h=1; h<=18; h++){
      const ga = getScore(round.id, a, h), gb = getScore(round.id, b, h);
      if(ga===null || gb===null) continue;
      const na = netHoleScore(round, a, h), nb = netHoleScore(round, b, h);
      if(na===null || nb===null) continue;
      total += Math.min(ga, gb) + Math.min(na, nb);
      count++;
    }
    results.push({ id: pair.id || `pair-${pi}`, label: `${a} & ${b}`, total, count });
  });
  return results;
}

function render(){
  document.getElementById('tournamentName').textContent = state.name;
  const roundsInfo = state.rounds.map(r=>r.course).join(' · ');
  document.getElementById('headerSub').textContent = `${state.players.length} players · ${roundsInfo}`;
  const imgEl = document.getElementById('tournamentImage');
  if(state.tournamentImageUrl){
    imgEl.src = state.tournamentImageUrl;
    imgEl.alt = state.name;
    imgEl.style.display = 'block';
  } else {
    imgEl.style.display = 'none';
  }
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('active', b.dataset.tab===currentTab));
  const main = document.getElementById('main');
  if(currentTab==='chat'){
    // Chat is built once and then updated in place, so live leaderboard
    // refreshes never wipe a half-typed message or scroll position.
    if(!document.getElementById('chatRoot')) mountChat(main);
  }
  else if(currentTab==='leaderboard') main.innerHTML = renderLeaderboard();
  else if(currentTab==='enter') main.innerHTML = renderEnter();
  else main.innerHTML = renderSetup();
  attachHandlers();
}

function fmtSigned(n){
  if(n>0) return `+${n}`;
  if(n===0) return 'E';
  return `${n}`;
}

function scoreCellHtml(count, total, toPar){
  if(count===0) return `<span class="lb-score-wrap"><span class="lb-score dim">—</span></span>`;
  const toParHtml = toPar!==null && toPar!==undefined
    ? `<span class="lb-topar ${toPar<0?'under':toPar>0?'over':'even'}">(${fmtSigned(toPar)})</span>`
    : '';
  const thruHtml = `<span class="lb-thru">${count>=18 ? 'F' : `Thru ${count}`}</span>`;
  return `<span class="lb-score-wrap"><span class="lb-score">${total}</span>${toParHtml}${thruHtml}</span>`;
}

function renderLeaderboard(){
  const visRounds = state.rounds.filter(r=>r.visible!==false);
  const tabs = `<div class="toplevel-tabs">
    <button data-lb="overall" class="${lbView==='overall'?'active':''}">OVERALL</button>
    ${visRounds.map(r=>`<button data-lb="${r.id}" class="${lbView===r.id?'active':''}">${r.label.toUpperCase()}</button>`).join('')}
  </div>`;

  if(!state.players.length) return tabs + `<div class="empty-state">No players yet. Add players in Setup.</div>`;

  if(lbView!=='overall' && !visRounds.some(r=>r.id===lbView)){
    lbView = 'overall';
  }

  if(lbView==='overall'){
    const gross = state.players.map(p=>{
      let total=0, count=0, parSum=0, anyMissingPar=false;
      visRounds.forEach(r=>{
        const {total:t, count:c, toPar} = roundGrossTotal(r.id, p.name);
        total+=t; count+=c;
        if(c>0){ if(toPar===null) anyMissingPar=true; else parSum+=toPar; }
      });
      return {name:p.name, total, count, toPar: (count>0 && !anyMissingPar) ? parSum : null};
    }).sort((a,b)=> (a.count===0)-(b.count===0) || a.total-b.total);

    const net = state.players.map(p=>{
      let total=0, count=0, parSum=0, anyMissingPar=false;
      visRounds.forEach(r=>{
        const {total:t, count:c, toPar} = roundNetTotal(r.id, p.name);
        total+=t; count+=c;
        if(c>0){ if(toPar===null) anyMissingPar=true; else parSum+=toPar; }
      });
      return {name:p.name, total, count, toPar: (count>0 && !anyMissingPar) ? parSum : null};
    }).sort((a,b)=> (a.count===0)-(b.count===0) || a.total-b.total);

    return tabs + `
      ${lbSection('overall-gross', 'Overall — Gross', `
        <div class="card">${gross.map((r,i)=>`
          <div class="lb-row">
            <span class="lb-rank">${r.count===0?'–':i+1}</span>
            <span class="lb-name">${escapeHtml(r.name)}</span>
            ${scoreCellHtml(r.count, r.total, r.toPar)}
          </div>`).join('')}
        </div>`)}
      ${lbSection('overall-net', 'Overall — Net', `
        <div class="card">${net.map((r,i)=>`
          <div class="lb-row">
            <span class="lb-rank">${r.count===0?'–':i+1}</span>
            <span class="lb-name">${escapeHtml(r.name)}</span>
            ${scoreCellHtml(r.count, r.total, r.toPar)}
          </div>`).join('')}
        </div>
        <p class="muted">Net = gross minus handicap strokes allocated per hole. To-par shows once par is entered for every hole played, in Setup.</p>`)}
      ${lbSection('overall-handicaps', 'Handicaps', `
        <div class="card">${[...state.players].sort((a,b)=> (Number(a.handicap)||0) - (Number(b.handicap)||0)).map((p,i)=>`
          <div class="lb-row">
            <span class="lb-rank">${i+1}</span>
            <span class="lb-name">${escapeHtml(p.name)}</span>
            <span class="lb-score">${Number(p.handicap)||0}</span>
          </div>`).join('')}
        </div>`)}
    `;
  } else {
    const round = getRound(lbView);
    const gross = state.players.map(p=>{
      const {total,count,toPar} = roundGrossTotal(round.id, p.name);
      return {name:p.name, total, count, toPar};
    }).sort((a,b)=> (a.count===0)-(b.count===0) || a.total-b.total);
    const net = state.players.map(p=>{
      const {total,count,toPar} = roundNetTotal(round.id, p.name);
      return {name:p.name, total, count, toPar};
    }).sort((a,b)=> (a.count===0)-(b.count===0) || a.total-b.total);

    let sixesHtml = '';
    if(round.format==='sixes'){
      const totals = sixesTotalsForRound(round.id);
      const rows = state.players.map(p=>({name:p.name, pts: totals[p.name]||0}))
        .sort((a,b)=>b.pts-a.pts);
      const hasGroups = (round.quads||[]).some(q=>q.players.filter(Boolean).length===4);

      const validQuads = (round.quads||[]).filter(q=>q.players.filter(Boolean).length===4);
      const groupsHtml = lbSection(`round-${round.id}-sixes-groups`, `${escapeHtml(round.label)} — Individual Sixes Points · Groups`, `
        <p class="muted" style="margin:-6px 0 12px;">(note: <strong>GROSS</strong> score will be used as a tie breaker)</p>
        ${validQuads.length ? validQuads.map((quad, qi)=>{
          const groupRows = quad.players.filter(Boolean).map(name=>{
            const {total:grossTotal, count:grossCount} = roundGrossTotal(round.id, name);
            return { name, pts: totals[name]||0, grossTotal, grossCount };
          }).sort((a,b)=>{
            if(b.pts !== a.pts) return b.pts - a.pts;
            const aHas = a.grossCount>0, bHas = b.grossCount>0;
            if(aHas !== bHas) return aHas ? -1 : 1;
            return a.grossTotal - b.grossTotal;
          });
          return `
          <div class="group-lb-block" style="margin-bottom:14px;">
            <div class="muted" style="font-family:'Oswald',sans-serif; letter-spacing:0.04em; font-size:12px; text-transform:uppercase; margin:0 0 6px;">Group ${qi+1}</div>
            <div class="card">
              ${groupRows.map((r,i)=>`
                <div class="lb-row">
                  <span class="lb-rank">${i+1}</span>
                  <span class="lb-name">${escapeHtml(r.name)}</span>
                  <span class="lb-score">${r.pts}</span>
                </div>`).join('')}
            </div>
          </div>`;
        }).join('') : `<div class="card"><div class="muted">Set up your foursomes for this round in Setup to see points.</div></div>`}`);

      const pointsHtml = lbSection(`round-${round.id}-sixes-points`, `${escapeHtml(round.label)} — Individual Sixes Points`, `
        <p class="muted" style="margin:-6px 0 12px;">(note: <strong>GROSS</strong> score will be used as a tie breaker)</p>
        <div class="card">
        ${hasGroups ? rows.map((r,i)=>`
          <div class="lb-row">
            <span class="lb-rank">${i+1}</span>
            <span class="lb-name">${escapeHtml(r.name)}</span>
            <span class="lb-score">${r.pts}</span>
          </div>`).join('') : `<div class="muted">Set up your foursomes for this round in Setup to see points.</div>`}
        </div>`);

      sixesHtml = `${groupsHtml}${pointsHtml}`;
    }

    let pairsHtml = '';
    if(round.format==='pairs'){
      const teamResults = pairsTotalsForRound(round.id)
        .sort((a,b)=> (a.count===0)-(b.count===0) || a.total-b.total);
      const hasPairs = (round.pairs||[]).some(p=>p.players.filter(Boolean).length===2);
      pairsHtml = lbSection(`round-${round.id}-pairs`, `${escapeHtml(round.label)} — Team Score (Best Ball Gross + Net)`, `
        <div class="card">
        ${hasPairs ? teamResults.map((r,i)=>`
          <div class="lb-row">
            <span class="lb-rank">${r.count===0?'–':i+1}</span>
            <span class="lb-name">${escapeHtml(r.label)}</span>
            <span class="lb-score ${r.count===0?'dim':''}">${r.count===0?'—':r.total}</span>
          </div>`).join('') : `<div class="muted">Set up your pairs for this round in Setup to see team scores.</div>`}
        </div>
        <p class="muted">Each hole: lower of the pair's two gross scores, plus lower of their two net scores. Summed over 18 — lowest total wins.</p>`);
    }

    const kpByHole = (round.kpHoles||[]).map(hole=>{
      const entries = state.players.map(p=>{
        const e = state.kp[kpKey(round.id, p.name, hole)];
        if(!e) return null;
        const feet = (e.feet===null || e.feet===undefined || e.feet==='') ? null : Number(e.feet);
        const inches = (e.inches===null || e.inches===undefined || e.inches==='') ? null : Number(e.inches);
        if(feet===null && inches===null) return null;
        return { player: p.name, feet: feet||0, inches: inches||0, total: (feet||0)*12 + (inches||0) };
      }).filter(Boolean).sort((a,b)=>a.total-b.total);
      return { hole, entries };
    });
    const ldByHole = (round.ldHoles||[]).map(hole=>{
      const entries = state.players.map(p=>{
        const e = state.ld[ldKey(round.id, p.name, hole)];
        if(!e || !e.checked) return null;
        return { player: p.name, ts: e.ts||0 };
      }).filter(Boolean).sort((a,b)=>b.ts-a.ts); // most recently checked first (treated as current winner)
      return { hole, entries };
    });
    const hasKpLd = (round.kpHoles||[]).length > 0 || (round.ldHoles||[]).length > 0;
    let kpLdHtml = '';
    if(hasKpLd){
      kpLdHtml = lbSection(`round-${round.id}-kpld`, 'Daily KP and LD', `
        ${ldByHole.map(({hole, entries})=>`
          <div class="card kp-ld-card">
            <div class="kp-ld-row">
              <span class="kp-ld-label">LONGEST DRIVE — HOLE ${hole}</span>
              <span class="kp-ld-value">${entries.length ? escapeHtml(entries[0].player) : '<span class="muted">No entries yet</span>'}</span>
            </div>
          </div>`).join('')}
        ${kpByHole.map(({hole, entries})=>`
          <div class="card">
            <div class="kp-ld-label" style="margin-bottom:8px;">CLOSEST TO PIN — HOLE ${hole}</div>
            ${entries.length ? entries.map((e,i)=>`
              <div class="lb-row">
                <span class="lb-rank">${i+1}</span>
                <span class="lb-name">${escapeHtml(e.player)}</span>
                <span class="lb-score">${e.feet}' ${e.inches}"</span>
              </div>`).join('') : `<div class="muted">No entries yet</div>`}
          </div>`).join('')}`);
    }

    const logoHtml = round.logoUrl
      ? `<div style="text-align:center; margin-bottom:16px;"><img src="${escapeAttr(round.logoUrl)}" alt="${escapeAttr(round.course)}" style="max-height:90px; max-width:100%; border-radius:6px;"></div>`
      : '';

    const roundInfoParts = [];
    if(round.course) roundInfoParts.push(escapeHtml(round.course));
    if(round.teeBox) roundInfoParts.push(`${escapeHtml(round.teeBox)} tees`);
    if(round.totalYardage) roundInfoParts.push(`${escapeHtml(round.totalYardage)} yds`);
    if(round.rating !== null && round.rating !== undefined && round.slope !== null && round.slope !== undefined){
      roundInfoParts.push(`${round.rating}/${round.slope}`);
    }
    const roundInfoLine1 = roundInfoParts.join(' · ');
    const roundInfoLine2 = round.firstTeeTime ? `First tee: ${escapeHtml(round.firstTeeTime)}` : '';
    const roundInfoHtml = (roundInfoLine1 || roundInfoLine2)
      ? `<p style="text-align:center; margin:-6px 0 14px; font-size:1.05rem; font-weight:600; color:#ffffff;">
          ${roundInfoLine1}${roundInfoLine1 && roundInfoLine2 ? '<br>' : ''}${roundInfoLine2}
        </p>`
      : '';

    return tabs + `
      ${logoHtml}
      ${roundInfoHtml}
      ${kpLdHtml}
      ${pairsHtml}
      ${sixesHtml}
      ${lbSection(`round-${round.id}-gross`, `${escapeHtml(round.label)} — ${escapeHtml(round.course)} · Gross`, `
        <div class="card">${gross.map((r,i)=>`
          <div class="lb-row">
            <span class="lb-rank">${r.count===0?'–':i+1}</span>
            <span class="lb-name">${escapeHtml(r.name)}</span>
            ${scoreCellHtml(r.count, r.total, r.toPar)}
          </div>`).join('')}
        </div>`)}
      ${lbSection(`round-${round.id}-net`, `${escapeHtml(round.label)} — ${escapeHtml(round.course)} · Net`, `
        <div class="card">${net.map((r,i)=>`
          <div class="lb-row">
            <span class="lb-rank">${r.count===0?'–':i+1}</span>
            <span class="lb-name">${escapeHtml(r.name)}</span>
            ${scoreCellHtml(r.count, r.total, r.toPar)}
          </div>`).join('')}
        </div>`)}
    `;
  }
}

function myTeeGroup(round){
  const groups = round.teeGroups || [];
  if(!groups.length) return null; // no lock configured for this round
  const myId = localStorage.getItem(`myTeeGroupId_${round.id}`);
  if(!myId) return undefined; // no selection made yet for this round
  return groups.find(g=>g.id===myId) || undefined;
}

function renderGroupPicker(round, visRounds){
  const groups = round.teeGroups || [];
  return `
    <h2 class="section-title">Select Your Foursome</h2>
    <div class="card">
      <label>Round</label>
      <select id="pickerRoundSelect">
        ${visRounds.map(r=>`<option value="${r.id}" ${r.id===round.id?'selected':''}>${escapeHtml(r.label)} — ${escapeHtml(r.course)}</option>`).join('')}
      </select>
      <p class="muted" style="margin:10px 0 0;">Pick the group you're playing in for ${escapeHtml(round.label)}. This phone will only be able to enter scores for these 4 players, for this round.</p>
    </div>
    <div class="card">
      ${groups.map(g=>`
        <button class="btn secondary" data-pick-teegroup="${g.id}" style="margin-bottom:10px; text-align:left; padding:14px 16px;">
          <div style="font-family:'Oswald',sans-serif; font-size:15px; margin-bottom:4px;">${escapeHtml(g.name || 'Group')}</div>

        </button>`).join('')}
    </div>
  `;
}

function renderEnter(){
  if(!state.players.length) return `<div class="empty-state">Add players in Setup first.</div>`;
  const visRounds = state.rounds.filter(r=>r.visible!==false);
  if(!visRounds.length) return `<div class="empty-state">No rounds are visible yet. Check back once the organizer opens one up.</div>`;
  if(!visRounds.some(r=>r.id===entrySel.round)) entrySel.round = visRounds[0].id;
  const round = getRound(entrySel.round);

  const myGroup = myTeeGroup(round);
  if(myGroup === undefined) return renderGroupPicker(round, visRounds);

  const allowedPlayers = myGroup ? sortedPlayers().filter(p=>myGroup.players.includes(p.name)) : sortedPlayers();
  if(myGroup && !allowedPlayers.some(p=>p.name===entrySel.player)){
    entrySel.player = allowedPlayers.length ? allowedPlayers[0].name : '';
  }

  const modeToggle = `<div class="toplevel-tabs">
    <button data-entry-mode="player" class="${entryMode==='player'?'active':''}">BY PLAYER</button>
    <button data-entry-mode="hole" class="${entryMode==='hole'?'active':''}">BY HOLE</button>
  </div>`;

  const roundPicker = `
    <div class="card">
      <label>Round</label>
      <select id="roundSelect">
        ${visRounds.map(r=>`<option value="${r.id}" ${r.id===round.id?'selected':''}>${escapeHtml(r.label)} — ${escapeHtml(r.course)}</option>`).join('')}
      </select>
      ${myGroup ? `<button class="btn secondary" id="switchGroupBtn" style="margin-top:4px;">Not ${escapeHtml(myGroup.name || 'this group')}? Switch group</button>` : ''}
    </div>`;

  if(entryMode === 'hole'){
    return modeToggle + roundPicker + renderEnterByHole(round, allowedPlayers, myGroup);
  }
  return modeToggle + roundPicker + renderEnterByPlayer(round, allowedPlayers);
}

function renderEnterByPlayer(round, allowedPlayers){
  const player = entrySel.player;
  let rows = '';
  for(let h=1; h<=18; h++){
    const existing = getScore(round.id, player, h);
    const par = round.par[h-1];
    const isKp = (round.kpHoles||[]).includes(h);
    const isLd = (round.ldHoles||[]).includes(h);
    let extraHtml = '';
    if(isKp){
      const kpEntry = state.kp[kpKey(round.id, player, h)] || {};
      extraHtml += `<div class="hole-extra">
        <span>KP</span>
        <input type="number" inputmode="numeric" data-kp-feet="${h}" placeholder="ft" value="${kpEntry.feet!==undefined && kpEntry.feet!==null?kpEntry.feet:''}">
        <span>ft</span>
        <input type="number" inputmode="numeric" data-kp-inches="${h}" placeholder="in" value="${kpEntry.inches!==undefined && kpEntry.inches!==null?kpEntry.inches:''}">
        <span>in</span>
      </div>`;
    }
    if(isLd){
      const ldEntry = state.ld[ldKey(round.id, player, h)] || {};
      extraHtml += `<div class="hole-extra">
        <label><input type="checkbox" data-ld-check="${h}" ${ldEntry.checked?'checked':''}> LD?</label>
      </div>`;
    }
    rows += `
      <div class="hole-row" data-hole-row="${h}">
        <span class="hole-row-num">${h}</span>
        <span class="hole-row-par">${par ? `Par ${par}` : ''}</span>
        <input type="number" inputmode="numeric" class="hole-row-input" data-live-hole="${h}" value="${existing!==null?existing:''}" placeholder="-">
        <button class="clear-x" data-clear-hole="${h}" title="Clear" style="${existing!==null?'':'visibility:hidden;'}">&times;</button>
        <span class="hole-row-status" data-status-key="${player}__${h}"></span>

      </div>`;
  }

  return `
    <div class="card">
      <label>Player</label>
      <select id="playerSelect">
        ${allowedPlayers.map(p=>`<option value="${escapeAttr(p.name)}" ${p.name===player?'selected':''}>${escapeHtml(p.name)}</option>`).join('')}

    </div>
    <div class="card hole-list">
      ${rows}
    </div>
    <p class="muted">Scores save automatically as you type — no need to press anything.</p>
  `;
}

function renderEnterByHole(round, allowedPlayers, myGroup){
  if(!entrySel.hole || entrySel.hole < 1 || entrySel.hole > 18) entrySel.hole = 1;
  const hole = entrySel.hole;
  const par = round.par[hole-1];
  const isKp = (round.kpHoles||[]).includes(hole);
  const isLd = (round.ldHoles||[]).includes(hole);

  const rows = allowedPlayers.map(p=>{
    const existing = getScore(round.id, p.name, hole);
    let extraHtml = '';
    if(isKp){
      const kpEntry = state.kp[kpKey(round.id, p.name, hole)] || {};
      extraHtml += `<div class="hole-extra">
        <span>KP</span>
        <input type="number" inputmode="numeric" data-kp-feet-player="${escapeAttr(p.name)}" placeholder="ft" value="${kpEntry.feet!==undefined && kpEntry.feet!==null?kpEntry.feet:''}">
        <span>ft</span>
        <input type="number" inputmode="numeric" data-kp-inches-player="${escapeAttr(p.name)}" placeholder="in" value="${kpEntry.inches!==undefined && kpEntry.inches!==null?kpEntry.inches:''}">
        <span>in</span>
      </div>`;
    }
    if(isLd){
      const ldEntry = state.ld[ldKey(round.id, p.name, hole)] || {};
      extraHtml += `<div class="hole-extra">
        <label><input type="checkbox" data-ld-check-player="${escapeAttr(p.name)}" ${ldEntry.checked?'checked':''}> LD?</label>
      </div>`;
    }
    return `
      <div class="hole-row" data-hole-row-player="${escapeAttr(p.name)}">
        <span class="hole-row-num" style="width:auto; flex:1; text-align:left; font-family:'IBM Plex Sans',sans-serif; font-size:15px; color:var(--cream);">${escapeHtml(p.name)}</span>
        <input type="number" inputmode="numeric" class="hole-row-input" style="flex:0 0 70px;" data-live-player="${escapeAttr(p.name)}" value="${existing!==null?existing:''}" placeholder="-">
        <button class="clear-x" data-clear-player="${escapeAttr(p.name)}" title="Clear" style="${existing!==null?'':'visibility:hidden;'}">&times;</button>
        <span class="hole-row-status" data-status-key="${p.name}__${hole}"></span>
        ${extraHtml}
      </div>`;
  }).join('');

  return `
    <div class="card">
      <div style="display:flex; align-items:center; justify-content:space-between;">
        <button class="btn secondary" id="prevHoleBtn" style="width:auto; padding:10px 16px;" ${hole<=1?'disabled':''}>&larr; Prev</button>
        <div style="text-align:center;">
          <div style="font-family:'Oswald',sans-serif; font-size:24px; color:var(--amber);">Hole ${hole}</div>
          <div class="muted">${par ? `Par ${par}` : ''}</div>
        </div>
        <button class="btn secondary" id="nextHoleBtn" style="width:auto; padding:10px 16px;" ${hole>=18?'disabled':''}>Next &rarr;</button>
      </div>
    </div>
    <div class="card hole-list">
      ${allowedPlayers.length ? rows : `<div class="empty-state">${myGroup ? 'No players in your group.' : 'No players yet.'}</div>`}
    </div>
    <p class="muted">Scores save automatically as you type — no need to press anything.</p>
  `;
}

function renderSetup(){
  let html = `<h2 class="section-title">Tournament Name</h2>
  <div class="card">
    <input type="text" id="nameInput" value="${escapeAttr(state.name)}" autocomplete="off" autocorrect="off">
    <button class="btn secondary" id="saveName">Update Name</button>
  </div>
  <div class="card">
    <label>Tournament Banner Image URL</label>

    <button class="btn secondary" id="saveTournamentImage">Update Banner</button>
    <p class="muted" style="margin-top:10px;">Upload the image file to your GitHub repo (e.g. in an "images" folder next to index.html), then enter its filename or full URL here. Shows at the top of every page.</p>

  <div class="card">
    <label style="display:flex; align-items:center; gap:8px; cursor:pointer; margin:0;">

    <p class="muted" style="margin:10px 0 0;">Default is off — net scoring uses each player's straight Handicap Index. Turn this on to convert it into a Course Handicap using each round's Rating and Slope instead. Any round below can override this individually.</p>
  </div>`;

  html += `<h2 class="section-title">Players &amp; Handicaps (${state.players.length})</h2><div class="card">`;
  state.players
    .map((p,i)=>({p,i})) // keep original index for handlers before sorting for display
    .sort((a,b)=> a.p.name.localeCompare(b.p.name))
    .forEach(({p,i})=>{
      html += `<div class="list-item">
        <span>${escapeHtml(p.name)}</span>
        <input type="number" data-hcp-index="${i}" value="${p.handicap}" step="1">

  html += `</div>

    <div class="row-flex">

  state.rounds.forEach((round, ri)=>{
    const isVisible = round.visible !== false;
    html += `<h2 class="section-title">${escapeHtml(round.label)} ${isVisible ? '' : '<span class="tag">HIDDEN</span>'}</h2>
    <div class="card">
      <label>Course</label>
      <input type="text" data-round-course="${round.id}" value="${escapeAttr(round.course)}" autocomplete="off" autocorrect="off">
      <label>Course Logo Image URL</label>
      <input type="text" data-round-logo="${round.id}" value="${escapeAttr(round.logoUrl||'')}" placeholder="e.g. images/twin-warriors-logo.png" autocomplete="off" autocorrect="off">
      <div class="row-flex">
        <div>
          <label>Tee Box</label>
          <input type="text" data-round-teebox="${round.id}" value="${escapeAttr(round.teeBox||'')}" placeholder="e.g. White">
        </div>
        <div>
          <label>First Tee Time</label>
          <input type="text" data-round-teetime="${round.id}" value="${escapeAttr(round.firstTeeTime||'')}" placeholder="e.g. 8:10 AM">
        </div>
      </div>
      <label>Total Yardage</label>
      <input type="text" data-round-yardage="${round.id}" value="${escapeAttr(round.totalYardage||'')}" placeholder="e.g. 6412">
      <label>Date (optional, TBD is fine)</label>
      <input type="text" data-round-date="${round.id}" value="${escapeAttr(round.date)}" placeholder="TBD">
      <label>Format</label>
      <select data-round-format="${round.id}">
        <option value="stroke" ${round.format==='stroke'?'selected':''}>Standard stroke play</option>
        <option value="sixes" ${round.format==='sixes'?'selected':''}>Individual Sixes (foursome, rotating 1-on-1, net score)</option>
        <option value="pairs" ${round.format==='pairs'?'selected':''}>Team Pairs (best-ball gross + best-ball net)</option>

      <label style="display:flex; align-items:center; gap:8px; cursor:pointer; margin-top:4px;">

      </div>

      <label>Closest to Pin holes (comma-separated)</label>

      <label>Longest Drive holes (comma-separated)</label>
      <input type="text" data-round-ldholes="${round.id}" value="${(round.ldHoles||[]).join(', ')}" placeholder="e.g. 8, 16">
    </div>
    <details data-details-key="${round.id}-hcpoverrides" ${uiDetailsState[`${round.id}-hcpoverrides`] ? 'open' : ''}>
      <summary>Handicap Adjustments for ${escapeHtml(round.label)} (optional, per-player)</summary>
      <div class="card">
        <p class="muted" style="margin-top:0;">Leave blank to use each player's default handicap from above. Set a value here only to adjust it for this specific round — e.g. after a blow-up or a career round.</p>
        ${sortedPlayers().map(p=>{
          const override = round.handicapOverrides && round.handicapOverrides[p.name];
          const hasOverride = override !== undefined && override !== null && override !== '';
          return `<div class="list-item">
            <span>${escapeHtml(p.name)} <span class="muted">(default ${Number(p.handicap)||0})</span></span>
            <input type="number" data-hcp-override="${round.id}:${escapeAttr(p.name)}" value="${hasOverride?override:''}" placeholder="${Number(p.handicap)||0}" style="width:70px;">
